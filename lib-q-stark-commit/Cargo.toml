[package]
name = "lib-q-stark-commit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "A framework for implementing various cryptographic commitment schemes, including non-hiding variants."
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
lib-q-stark-field = { path = "../lib-q-stark-field", version = "0.0.10" }
lib-q-stark-matrix = { path = "../lib-q-stark-matrix", version = "0.0.10" }
lib-q-stark-util = { path = "../lib-q-stark-util", version = "0.0.10" }

itertools = { workspace = true }
serde = { workspace = true, default-features = false, features = ["alloc", "derive"] }


[dev-dependencies]
lib-q-stark-baby-bear = { path = "../lib-q-stark-baby-bear" }
lib-q-stark-challenger = { path = "../lib-q-stark-challenger" }
lib-q-stark-dft = { path = "../lib-q-stark-dft" }
lib-q-stark-merkle = { path = "../lib-q-stark-merkle" }
lib-q-stark-shake128 = { path = "../lib-q-stark-shake128" }
lib-q-stark-symmetric = { path = "../lib-q-stark-symmetric" }
rand = { workspace = true, default-features = false }

[features]
default = ["alloc"]
std = ["alloc"]
alloc = []
no_std = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(eurydice)',
    'cfg(doc_cfg)',
] }
