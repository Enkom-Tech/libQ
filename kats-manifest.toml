#   lib-q-ml-dsa/tests/wycheproof, lib-q-ml-dsa/tests/test_vectors, lib-q-k12/tests/data,
#   lib-q-random/tests/data, lib-q-hpke/tests/fixtures, lib-q-blind-pcs/tests/vectors,
#   lib-q-blind-token/tests/vectors, lib-q-dkg/tests/vectors, lib-q-lattice-zkp/tests/vectors,
#   lib-q-mac/tests/vectors, lib-q-zkp/tests/vectors, lib-q-prf/tests, export/kat-vectors
# See scratchpad/audit-triage/fix-kat-registration.md for the full per-corpus investigation notes.
#
#
# 2026-08-09 (card t_09d6f186): `lib-q-aead/tests/vectors` added for the new Saturnin-SIV mode.
# Saturnin-SIV is ASSEMBLED IN THIS REPOSITORY (Saturnin-CTR + KMAC256 in the Rogaway-Shrimpton
# SIV arrangement), so there is no upstream reference implementation and no external vector set
# that could exist for it. Its vectors are therefore `origin = "self-generated"` -- a regression
# pin on this crate's own output and NOT conformance evidence -- and both the file's own header
# and the generating test say exactly that.
#
# 2026-08-09 (card t_71d4f79a, FN-DSA half): `lib-q-fn-dsa/fn-dsa/tests/kats` added. The crate had
# 90+90 inline KAT digests in `fn-dsa/src/lib.rs` whose comment attributed their divergence from
# upstream `fn-dsa` 0.3.0 to "compiler optimization differences" -- i.e. self-generated values with
# a benign-sounding label, on a fully seed-deterministic construction where no such excuse exists.
# Measured against the real upstream crate, 79/90 (shake256x4) and 81/90 (non-shake256x4) of those
# digests are in fact IDENTICAL to upstream's published ones, and every difference is at logn <= 6
# (KeyPairGeneratorWeak toy degrees). The two files registered below are the external oracle that
# replaces the excuse: upstream 0.3.0's own behaviour, expanded to raw sk/vk/sig bytes.
roots = ["lib-q-fn-dsa/fn-dsa/tests/kats", "lib-q-hqc/kats","lib-q-saturnin/tests/fixtures", "lib-q-aead/tests/vectors", "lib-q-mayo/tests/kats", "lib-q-romulus/tests/fixtures", "lib-q-ml-dsa/tests/kats", "lib-q-cb-kem/data", "lib-q-sha3/tests/data", "lib-q-keccak-digest/tests/data", "lib-q-ml-kem/tests", "lib-q-slh-dsa/tests/acvp", "lib-q-ml-dsa/tests/wycheproof", "lib-q-ml-dsa/tests/test_vectors", "lib-q-k12/tests/data", "lib-q-random/tests/data", "lib-q-hpke/tests/fixtures", "lib-q-blind-pcs/tests/vectors", "lib-q-blind-token/tests/vectors", "lib-q-dkg/tests/vectors", "lib-q-lattice-zkp/tests/vectors", "lib-q-mac/tests/vectors", "lib-q-zkp/tests/vectors", "lib-q-prf/tests", "export/kat-vectors", "lib-q-maul/tests/vectors"]

