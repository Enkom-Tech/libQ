# --- lib-q-ml-dsa/tests/kats/acvp-1_1_0_36/ -- genuine NIST ACVP vectors ---------------------
# Registered 2026-08-07. All six verified by LIVE DOWNLOAD against github.com/usnistgov/ACVP-Server
# at tag v1.1.0.36 -- the exact tag the directory name encodes -- and byte-for-byte identical.
# This is real NIST conformance data and the strongest such evidence lib-q-ml-dsa has.
#
# WHY THE ROOT IS THIS SUBDIRECTORY AND NOT ITS PARENT. The parent, lib-q-ml-dsa/tests/kats/, also
# holds nistkats*.json, which are NOT NIST vectors despite the name: tests/kats/README.md states
# they come from ./generate_kats.py driving a vendored copy of github.com/GiacomoPope/dilithium-py
# PR #1 "with some modifications". That is still an INDEPENDENT implementation, so it is a real
# cross-check and NOT the lib-q-hqc laundering pattern (vectors from the code under test). Three
# things block registering them, all recorded on card t_71d4f79a rather than papered over here:
#   1. CHECK 5 requires a leading `#`-comment header naming the origin. JSON has no comment
#      syntax, so a self-generated JSON file CANNOT satisfy that rule as written. Fixing this is a
#      guard design change (a `_provenance` key would alter the bytes and the hash), and widening
#      an exemption is precisely the move a reviewer previously caught as exploitable.
#   2. The filename asserts NIST provenance the files lack. CHECK 4's ban is word-bounded, so
#      "nistkats" slips past where "nist_kats" would not -- the regex is not the point, a human
#      reading the name is misled. Renaming touches three ci.yml `--test nistkats` call sites.
#   3. "with some modifications" is undisclosed in scope; any change made to agree with
#      lib-q-ml-dsa reduces the independence these vectors are valued for.
# Also note tests/kats/requirements.txt would be swept as a `.txt` under the parent root and is
# not a KAT file at all.

[[kat]]
path = "lib-q-ml-dsa/tests/kats/acvp-1_1_0_36/keygen/prompt.json"
origin = "upstream"
upstream_url = "https://raw.githubusercontent.com/usnistgov/ACVP-Server/v1.1.0.36/gen-val/json-files/ML-DSA-keyGen-FIPS204/prompt.json"
