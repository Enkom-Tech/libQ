# --- lib-q-ml-dsa/tests/kats/dilithium-py-kats-*.json -- cross-implementation, NOT NIST ------
# Registered 2026-08-07, and RENAMED in the same pass. These six were called `nistkats-{44,65,87}`
# and `nistkats_pre_hashed-{44,65,87}` and contain no NIST data whatsoever. CHECK 4's naming ban is
# word-bounded, so "nistkats" slipped past it where "nist_kats" would have been caught -- the regex
# was never the point; a human reading the filename was misled. `lib-q-ml-dsa/tests/nistkats.rs`
# (the test target) and `generate_kats.py` (which writes them) were updated with the rename. The
# test TARGET keeps its old name for now only because renaming it would break
# lib-q-ml-dsa/scripts/security_audit.sh, which CI runs on push; carded as a follow-up.
#
# WHERE THEY ACTUALLY COME FROM, and this is NOT what the crate's README said. They are not
# generated in this repository at all. All six are byte-for-byte identical to
# github.com/cryspen/libcrux at commit 5c3fc214252573b1383ab54528aba3d8c21486a2 ("Apply domain
# separation in the right order", 2024-10-01), under libcrux-ml-dsa/tests/kats/ -- verified by LIVE
# DOWNLOAD from raw.githubusercontent.com (HTTP 200 on all six), not by comparing against this
# repo's own gitignored reference/libcrux-main copy, which would be circular. `dilithium.py` itself
# is likewise byte-identical to libcrux's at that commit
# (dae8399f307dc81986b4fbe2d19c9f7992533727b23386033714f5e50bbc9b5c). Hence `origin = "upstream"`
# with a citable URL and hash, which is a strictly stronger and more honest claim than the
# "self-generated" these files would have got from the README's account.
#
# HOW INDEPENDENT IS THIS CROSS-CHECK, without inflation in either direction:
#   * The BASE is genuinely independent: dilithium.py descends from
#     github.com/GiacomoPope/dilithium-py PR #1 (head cc1fd2adee5203fa52b87015229536892990621d), a
#     third-party Python implementation. A diff against that exact commit shows only ONE of the
#     eight vendored files differs in substance -- the other seven are `black` reformatting only.
