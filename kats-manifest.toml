# --- lib-q-sha3/tests/data/turboshake/ -- RFC 9861 TurboSHAKE128/256 vectors, via RustCrypto ----
# Registered 2026-08-09. TurboSHAKE128/256 had NO known-answer
# vectors at all -- only property tests, with a comment arguing that was "more robust than
# hardcoded test vectors", the wrong call for a standardized primitive since a property test cannot
# detect divergence from the standard. RFC 9861 ("KangarooTwelve and TurboSHAKE") was fetched
# directly (https://www.rfc-editor.org/rfc/rfc9861.txt): a TurboSHAKE256 D=`06` inline example and
# an RFC-quoted KT128 value (which decomposes into a TurboSHAKE128 D=`07` call) were both found
# byte-for-byte inside the decoded `.blb` contents -- see
# lib-q-sha3/tests/data/turboshake/PROVENANCE.md for exactly which vectors, and why the rest were
# not individually hand-matched (most vectors here come from the same RFC section's broader KAT
# tradition, not the short excerpt it spells out inline). The files themselves are vendored
# byte-for-byte from RustCrypto's `turboshake` crate (named `turbo-shake` before PR #843), whose own
# test harness packs the RFC 9861 vectors into `blobby` 0.4 containers -- verified against a LIVE,
# PINNED commit (the crate has no tagged release yet: `0.1.0 UNRELEASED`), not a filename-only
# match. This is the fix for the *previous* state of these paths: `tests/data/turboshake*.blb` used
# to exist flat under `tests/data/` but were each one byte short of RustCrypto's real files and did
# not decode under `blobby` (see this file's `[scan]` comment above and
# lib-q-sha3/tests/data/upstream/PROVENANCE.md's 2026-08-09 update) -- they have been replaced and
# moved to their own subdirectory, registered as its own root precisely so the other ~15
# unregistered `.blb` files under the parent `tests/data/` are not swept in without their own
# per-file investigation. Binary containers cannot carry a `#`-comment header, so CHECK 5 reads
# these entries' provenance from the PROVENANCE.md sidecar in this same directory, not a header.

