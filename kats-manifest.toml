# Provenance manifest for committed KAT (Known-Answer-Test) vector files.
#
# HASH: every pin below is SHA3-256 (FIPS 202) of the file, CRLF-normalised for text formats.
# lib-Q ships no SHA-2. On 2026-10-30 every pin moved from SHA-256 to SHA3-256 in one run that
# recomputed each file's SHA-256, asserted it equalled the recorded pin, and only then wrote the
# SHA3-256 of the same bytes. Upstream entries keep their old SHA-256 in a comment, because that
# is the value upstream's own published checksums can be compared against. Older narrative
# comments below that quote a short hex prefix (e.g. "9936c724...") quote that old SHA-256.
#
# Enforced by scripts/ci-guard-kat-provenance.sh / ci_guard_kat_provenance.py -- read that pair
# for the full rationale. In short: every vector file discovered under a registered
# `[scan].roots` directory must have exactly one `[[kat]]` entry below; the entry's `sha3_256` must
# match the file's current content; an entry whose `origin` is not "upstream" may not sit at a
# path or carry a filename containing "official", "nist", or "rfc" (case-insensitive); and the
# file's own leading `#`-comment header must say what the manifest says. That combination is the
# fix for the KAT-provenance audit: lib-q-hqc shipped a KAT tree at `kats/official/` whose every response
# value was written by the code under test, and nothing before this manifest could tell a reader
# that from the file, the tree name, or a CI check.
#
# `origin` is one of:
#   "upstream"       -- genuinely sourced from an external reference implementation. Requires
#                        `upstream_url` and `upstream_sha3_256`.
#   "self-generated" -- produced by this repo's own code under test. Requires `generator`
#                        (which test/function produced it, and how to reproduce it).
#   "third-party"     -- sourced from somewhere else (e.g. the NIST PQCgenKAT request-file
#                        template) but not independently re-verified against a pinned upstream
#                        URL/hash this session. Requires `source`.
#
# Rollout scope, updated 2026-08-06 (KAT-provenance audit, second pass): the
# original rollout covered lib-q-hqc only. This pass investigated the two other KAT-shaped trees
# named in that original comment and registers both:
#
#   * lib-q-saturnin/tests/fixtures/ -- three NIST LWC round-2 Saturnin submission vector files.
#     Verified by downloading the actual NIST CSRC submission zip
#     (https://csrc.nist.gov/CSRC/media/Projects/lightweight-cryptography/documents/round-2/
#     submissions-rnd2/saturnin.zip, confirmed live: `curl -sI` -> HTTP 200) and hashing the three
#     KAT files inside it directly -- all three match the vendored copies byte-for-byte once CRLF
#     is normalised to LF (see CHECK 3's `sha3_256_of`; two of the three already have no CRLF on
#     this checkout and match at the raw-byte level too). `LWC_AEAD_KAT_256_128_saturninshortv2.txt`
#     had no upstream hash documented anywhere in the repo before this pass -- the `upstream_sha3_256`
#     below was derived directly from that download, not carried over from an existing claim.
#   * lib-q-mayo/tests/kats/PQCsignKAT_24_MAYO_2.rsp -- verified by fetching
#     https://raw.githubusercontent.com/PQCMayo/MAYO-C/main/KAT/PQCsignKAT_24_MAYO_2.rsp (the MAYO
#     team's own reference implementation) live and hashing it: byte-for-byte identical to the
#     vendored copy.
#
# These vector files are vendored BYTE-FOR-BYTE from their designers' own distributions -- that is
# precisely what gives them evidentiary value. They therefore do NOT carry a leading `#`-comment
# header the way self-generated/third-party entries must: adding one would edit their bytes and
# falsify the very "sha3_256 == upstream_sha3_256" equality that IS their provenance evidence. CHECK 5
# in ci_guard_kat_provenance.py encodes an explicit, narrow exemption for exactly this case --
# read that check's comment for why it cannot be claimed by a non-upstream entry.
#
# HOW A FILE THAT CANNOT CARRY A HEADER GETS REGISTERED (new 2026-08-07).
# CHECK 5's header rule is satisfiable only by formats where a leading `#` line is a comment. JSON
# has no comment syntax and binary containers have none either, so before this pass a SELF-GENERATED
# non-text KAT file could not be registered AT ALL -- the guard could never pass for it. That was a
# structural gap, not a judgement call, and it was why ~31 KAT-shaped files in this repo sat outside
# the guard. It is now closed by a SIDECAR rather than by widening the upstream exemption (widening
# it is what a reviewer previously caught as exploitable in this audit): a file whose format cannot
# carry a `#` header must instead be named, with its origin and a real description, in a
# PROVENANCE.md in its own directory or an ancestor up to its scan root -- machine-checked in both
# directions, so an unlisted file fails and a stale line fails. The upstream byte-identity exemption
# is now UNREACHABLE for such files: it exists to avoid falsifying a header a text file could have
# carried, which is no excuse for a format that could never have carried one. See CHECK 5's
# docstring in scripts/ci_guard_kat_provenance.py.
#
# Still do NOT add a root below without first doing the same per-file investigation (a same-seed
# byte diff against a genuine upstream source, or an honest admission that none exists and the
# file is a pin). Fabricating an `origin` to satisfy this guard would be exactly the failure mode
# it exists to catch, just moved one level up.

[scan]
# 2026-08-09 ("unregistered majority" pass): a repo-wide sweep found
# 96 tracked files matching the [scan] extensions, of which only 29 were registered -- the
# unregistered majority included the best corpora in the repo (ML-KEM ACVP, SLH-DSA ACVP, ML-DSA
# Wycheproof). This pass investigated and registered ALL of them. New roots added (parent dirs
# supersede narrower previously-registered subdirectory roots where noted, since os.walk recurses):
#   lib-q-sha3/tests/data           (supersedes the former .../turboshake root; recursive, still
#                                     covers turboshake/ and upstream/)
#   lib-q-cb-kem/data               (supersedes the former .../data/kat root; recursive)
#   lib-q-keccak-digest/tests/data, lib-q-ml-kem/tests, lib-q-slh-dsa/tests/acvp,
#   lib-q-ml-dsa/tests/wycheproof, lib-q-ml-dsa/tests/test_vectors, lib-q-k12/tests/data,
#   lib-q-random/tests/data, lib-q-hpke/tests/fixtures, lib-q-blind-pcs/tests/vectors,
#   lib-q-blind-token/tests/vectors, lib-q-dkg/tests/vectors, lib-q-lattice-zkp/tests/vectors,
#   lib-q-mac/tests/vectors, lib-q-zkp/tests/vectors, lib-q-prf/tests, export/kat-vectors
# (The full per-corpus investigation notes are audit notes; not published.)
#
#
# 2026-08-09: `lib-q-aead/tests/vectors` added for the new Saturnin-SIV mode.
# Saturnin-SIV is ASSEMBLED IN THIS REPOSITORY (Saturnin-CTR + KMAC256 in the Rogaway-Shrimpton
# SIV arrangement), so there is no upstream reference implementation and no external vector set
# that could exist for it. Its vectors are therefore `origin = "self-generated"` -- a regression
# pin on this crate's own output and NOT conformance evidence -- and both the file's own header
# and the generating test say exactly that.
#
# 2026-08-09 (FN-DSA half): `lib-q-fn-dsa/fn-dsa/tests/kats` added. The crate had
# 90+90 inline KAT digests in `fn-dsa/src/lib.rs` whose comment attributed their divergence from
# upstream `fn-dsa` 0.3.0 to "compiler optimization differences" -- i.e. self-generated values with
# a benign-sounding label, on a fully seed-deterministic construction where no such excuse exists.
# Measured against the real upstream crate, 79/90 (shake256x4) and 81/90 (non-shake256x4) of those
# digests are in fact IDENTICAL to upstream's published ones, and every difference is at logn <= 6
# (KeyPairGeneratorWeak toy degrees). The two files registered below are the external oracle that
# replaces the excuse: upstream 0.3.0's own behaviour, expanded to raw sk/vk/sig bytes.
roots = ["lib-q-fn-dsa/fn-dsa/tests/kats", "lib-q-hqc/kats","lib-q-saturnin/tests/fixtures", "lib-q-aead/tests/vectors", "lib-q-mayo/tests/kats", "lib-q-romulus/tests/fixtures", "lib-q-ml-dsa/tests/kats", "lib-q-cb-kem/data", "lib-q-sha3/tests/data", "lib-q-keccak-digest/tests/data", "lib-q-ml-kem/tests", "lib-q-slh-dsa/tests/acvp", "lib-q-ml-dsa/tests/wycheproof", "lib-q-ml-dsa/tests/test_vectors", "lib-q-k12/tests/data", "lib-q-random/tests/data", "lib-q-hpke/tests/fixtures", "lib-q-blind-pcs/tests/vectors", "lib-q-blind-token/tests/vectors", "lib-q-dkg/tests/vectors", "lib-q-lattice-zkp/tests/vectors", "lib-q-mac/tests/vectors", "lib-q-zkp/tests/vectors", "lib-q-prf/tests", "export/kat-vectors", "lib-q-maul/tests/vectors"]

# lib-q-hpke/tests/fixtures/negotiated_params_strict_pq_base.json -- self-generated frozen
# negotiation-output fixture (see lib-q-hpke/tests/fixtures/PROVENANCE.md). Was previously named
# negotiated_params_rfc_strict_pq_base.json; renamed 2026-08-09 because the old path contained
# "rfc" (from the `RfcStrictPq` profile name), which CHECK 4 correctly refuses for a non-upstream
# entry. Content unchanged, name only.
# `lib-q-ml-dsa/tests/kats` REPLACED the narrower `lib-q-ml-dsa/tests/kats/acvp-1_1_0_36` root on
# 2026-08-07. The subdirectory was registered deliberately at the time because the parent also holds
# the six former `nistkats*.json` files, which could not then be registered (no way to satisfy
# CHECK 5) and would have failed CHECK 2 as uncovered. Both blockers are now gone: the sidecar rule
# lets a JSON file declare its provenance, and the files have been renamed to stop claiming NIST
# provenance they never had. The parent root is recursive, so the six ACVP files are still covered.
#
# Exact repo-relative paths discovery skips. NOT globs, and every one must exist or CHECK 1 fails.
# This is an escape hatch and should be read as one -- treat any addition with the same suspicion as
# a fabricated `origin`. The single entry is a pip pin that happens to be a `.txt` living in a
# directory of vector files; it contains one line, `pycryptodome==3.19.1`.
exclude = ["lib-q-ml-dsa/tests/kats/requirements.txt"]
# `lib-q-romulus/tests/fixtures` added 2026-08-07, only after doing the same per-file provenance
# work the note below demands: both files were matched against a live NIST download, not assumed.
# A repo-wide sweep the same day found 49 KAT-shaped tracked files against 10 registered entries;
# Romulus was picked out of that backlog first because it is the identical file format from the
# identical competition as the Saturnin fixtures, so the already-proven method applied directly.
# The remaining unregistered files (lib-q-sha3 15, lib-q-keccak-digest 5,
# lib-q-threshold-kem-lattice 4, lib-q-ml-dsa/tests/test_vectors 1, lib-q-ml-dsa/tests/wycheproof 6)
# are NOT yet registered and adding their roots here before establishing each file's origin would
# just convert an unknown into a wall of CHECK 2 failures. The lib-q-ml-dsa/tests/kats 12 that this
# line used to count are now all registered below. See the KAT-provenance audit; in particular, do NOT
# register the .blb files on a filename match with RustCrypto -- 9 of them share a name with
# github.com/RustCrypto/hashes and NONE matches its bytes, and that is unexplained.
# A file is in scope if its extension (case-insensitive, without the dot) is one of these...
# ("txt" was added in the 2026-08-06 pass: the Saturnin fixture filenames end in e.g.
# "_saturninhashv2.txt", not "_kat.txt", so no filename_suffix below matched them. Checked at the
# time: lib-q-hqc/kats has zero `.txt` files, so this widening does not retroactively sweep in
# anything unexpected under the already-registered root.)
# "json" added 2026-08-07 for the ML-DSA ACVP vectors. Scoped by [scan].roots, so it does not
# sweep unrelated JSON. Note the root is the acvp-1_1_0_36 SUBdirectory, deliberately, not its
# parent -- see the ML-DSA section at the bottom for why.
# "blb" added 2026-08-09 for the TurboSHAKE vectors below. The old comment in this file (just above
# the [scan] table) used to say "9 of them share a name with github.com/RustCrypto/hashes and NONE
# matches its bytes, and that is unexplained" -- that was about
# `lib-q-sha3/tests/data/turboshake{128,256}_{6,7}.blb`, each of which was one byte short of the
# real RustCrypto file and did not decode under `blobby`. They have since been replaced with
# byte-exact copies (verified against a live, pinned RustCrypto/hashes commit) and MOVED to their
# own subdirectory, `lib-q-sha3/tests/data/turboshake/`, registered as its own root below --
# deliberately not the parent `tests/data/`, which still holds ~15 other unregistered `.blb` files
# each needing its own provenance pass before being swept in.
extensions = ["rsp", "req", "kat", "txt", "json", "blb"]
# ...or its filename (case-insensitive) ends with one of these suffixes.
# "intermediates_values" added 2026-08-09 (HQC half). Upstream HQC ships its
# reference intermediate-value dumps with NO file extension at all, so no `extensions` entry could
# ever reach them and they would sit outside the guard entirely -- and a [[kat]] entry alone does
# not help, because CHECK 2 rejects any manifest entry for a file discovery did not find (it reads
# as a stale entry). This suffix is deliberately the whole filename, so it sweeps in exactly those
# dumps and nothing else; `extensions` is left untouched so no extensionless file in general
# becomes a KAT candidate.
filename_suffixes = ["_kat.txt", "intermediates_values"]

