# `lib-q-ml-dsa/tests/kats` REPLACED the narrower `lib-q-ml-dsa/tests/kats/acvp-1_1_0_36` root on
# 2026-08-07. The subdirectory was registered deliberately at the time because the parent also holds
# the six former `nistkats*.json` files, which could not then be registered (no way to satisfy
# CHECK 5) and would have failed CHECK 2 as uncovered. Both blockers are now gone: the sidecar rule
# lets a JSON file declare its provenance, and the files have been renamed to stop claiming NIST
# provenance they never had. The parent root is recursive, so the six ACVP files are still covered.
#
# Exact repo-relative paths discovery skips. NOT globs, and every one must exist or CHECK 1 fails.
# This is an escape hatch and should be read as one -- treat any addition with the same suspicion as
# a fabricated `origin`. The single entry is a pip pin that happens to be a `.txt` living in a
