# Provenance manifest for committed KAT (Known-Answer-Test) vector files.
#
# Enforced by scripts/ci-guard-kat-provenance.sh / ci_guard_kat_provenance.py -- read that pair
# for the full rationale. In short: every vector file discovered under a registered
# `[scan].roots` directory must have exactly one `[[kat]]` entry below; the entry's `sha256` must
# match the file's current content; an entry whose `origin` is not "upstream" may not sit at a
# path or carry a filename containing "official", "nist", or "rfc" (case-insensitive); and the
# file's own leading `#`-comment header must say what the manifest says. That combination is the
# fix for card t_71d4f79a: lib-q-hqc shipped a KAT tree at `kats/official/` whose every response
# value was written by the code under test, and nothing before this manifest could tell a reader
# that from the file, the tree name, or a CI check.
#
# `origin` is one of:
#   "upstream"       -- genuinely sourced from an external reference implementation. Requires
#                        `upstream_url` and `upstream_sha256`.
#   "self-generated" -- produced by this repo's own code under test. Requires `generator`
#                        (which test/function produced it, and how to reproduce it).
#   "third-party"     -- sourced from somewhere else (e.g. the NIST PQCgenKAT request-file
#                        template) but not independently re-verified against a pinned upstream
#                        URL/hash this session. Requires `source`.
#
# Rollout scope, updated 2026-08-06 (card t_71d4f79a, lane e-kat-provenance, second pass): the
# original rollout covered lib-q-hqc only. This pass investigated the two other KAT-shaped trees
# named in that original comment and registers both:
#
#   * lib-q-saturnin/tests/fixtures/ -- three NIST LWC round-2 Saturnin submission vector files.
#     Verified by downloading the actual NIST CSRC submission zip
#     (https://csrc.nist.gov/CSRC/media/Projects/lightweight-cryptography/documents/round-2/
#     submissions-rnd2/saturnin.zip, confirmed live: `curl -sI` -> HTTP 200) and hashing the three
#     KAT files inside it directly -- all three match the vendored copies byte-for-byte once CRLF
#     is normalised to LF (see CHECK 3's `sha256_of`; two of the three already have no CRLF on
#     this checkout and match at the raw-byte level too). `LWC_AEAD_KAT_256_128_saturninshortv2.txt`
#     had no upstream hash documented anywhere in the repo before this pass -- the `upstream_sha256`
#     below was derived directly from that download, not carried over from an existing claim.
#   * lib-q-mayo/tests/kats/PQCsignKAT_24_MAYO_2.rsp -- verified by fetching
#     https://raw.githubusercontent.com/PQCMayo/MAYO-C/main/KAT/PQCsignKAT_24_MAYO_2.rsp (the MAYO
#     team's own reference implementation) live and hashing it: byte-for-byte identical to the
#     vendored copy.
#
# These vector files are vendored BYTE-FOR-BYTE from their designers' own distributions -- that is
# precisely what gives them evidentiary value. They therefore do NOT carry a leading `#`-comment
# header the way self-generated/third-party entries must: adding one would edit their bytes and
# falsify the very "sha256 == upstream_sha256" equality that IS their provenance evidence. CHECK 5
# in ci_guard_kat_provenance.py encodes an explicit, narrow exemption for exactly this case --
# read that check's comment for why it cannot be claimed by a non-upstream entry.
#
# Still do NOT add a root below without first doing the same per-file investigation (a same-seed
# byte diff against a genuine upstream source, or an honest admission that none exists and the
# file is a pin). Fabricating an `origin` to satisfy this guard would be exactly the failure mode
# it exists to catch, just moved one level up.

[scan]
roots = ["lib-q-hqc/kats", "lib-q-saturnin/tests/fixtures", "lib-q-mayo/tests/kats", "lib-q-romulus/tests/fixtures", "lib-q-ml-dsa/tests/kats/acvp-1_1_0_36"]
# `lib-q-romulus/tests/fixtures` added 2026-08-07, only after doing the same per-file provenance
# work the note below demands: both files were matched against a live NIST download, not assumed.
# A repo-wide sweep the same day found 49 KAT-shaped tracked files against 10 registered entries;
# Romulus was picked out of that backlog first because it is the identical file format from the
# identical competition as the Saturnin fixtures, so the already-proven method applied directly.
# The remaining unregistered files (lib-q-sha3 15, lib-q-ml-dsa 12, lib-q-keccak-digest 5,
# lib-q-threshold-kem-lattice 4, lib-q-ml-dsa/tests/test_vectors 1) are NOT yet registered and
# adding their roots here before establishing each file's origin would just convert an unknown
# into a wall of CHECK 2 failures. See card t_71d4f79a.
# A file is in scope if its extension (case-insensitive, without the dot) is one of these...
# ("txt" was added in the 2026-08-06 pass: the Saturnin fixture filenames end in e.g.
# "_saturninhashv2.txt", not "_kat.txt", so no filename_suffix below matched them. Checked at the
# time: lib-q-hqc/kats has zero `.txt` files, so this widening does not retroactively sweep in
# anything unexpected under the already-registered root.)
# "json" added 2026-08-07 for the ML-DSA ACVP vectors. Scoped by [scan].roots, so it does not
# sweep unrelated JSON. Note the root is the acvp-1_1_0_36 SUBdirectory, deliberately, not its
# parent -- see the ML-DSA section at the bottom for why.
extensions = ["rsp", "req", "kat", "txt", "json"]
# ...or its filename (case-insensitive) ends with one of these suffixes.
filename_suffixes = ["_kat.txt"]

