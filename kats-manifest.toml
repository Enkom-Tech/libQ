# --- lib-q-cb-kem/data/kat/cbkem348864.rsp -- Classic McEliece designers' own reference C ------
# Registered 2026-08-09 (card t_71d4f79a, "Classic McEliece half"). This is NOT a downloaded
# pre-existing file (no such file exists: NIST/the classic.mceliece.org submission package ships
# only the PQCgenKAT_kem-equivalent GENERATOR source, `Reference_Implementation/kem/<variant>/
# nist/kat_kem.c` + `nist/rng.c`, not precomputed `.rsp` answer files, for any of its 10
# parameter sets -- confirmed by extracting and grepping the live submission tarball). Instead
# this file's bytes were produced by actually BUILDING and RUNNING that official generator: the
# `mceliece-20221023.tar.gz` submission package's `Reference_Implementation/kem/mceliece348864`
# C code, compiled with gcc against XKCP's `libXKCP.a`/`SimpleFIPS202.h`
# (github.com/XKCP/XKCP, cloned fresh 2026-08-09, commit at clone time) for SHAKE256 (symlinked
# to the historical `libkeccak.a`/`libkeccak.a.headers` names the reference `build` script
# expects) and the system OpenSSL `libcrypto` (Ubuntu libssl-dev 3.0.2-0ubuntu1.26) for the
# AES256-ECB primitive `nist/rng.c`'s CTR_DRBG uses, then executed (`./kat kem/mceliece348864`)
# under WSL2 Ubuntu. KATNUM=10 (the value the reference package's own `KATNUM` file specifies).
# This is a genuinely external oracle -- an independent C implementation by the scheme's own
# designers, not lib-q-cb-kem's own code -- but it is deliberately labelled `origin =
# "third-party"`, not `"upstream"`, because there is no separately-published upstream file with a
# citable URL/hash to pin `upstream_sha256` against: WE generated these exact bytes by running
# the designers' generator ourselves, so "upstream_sha256 == sha256" would just be comparing this
# file to itself, not independent verification. `lib-q-cb-kem/tests/katkem.rs::official_kat_348864`
# consumes this file and asserts byte-exact pk/sk/ct/ss agreement against lib_q_cb_kem's own
# keypair/encapsulate/decapsulate for all 10 testcases -- verified passing before this entry was
# added. The vector file's own leading `#`-comment (added by us, since the reference tool's raw
# output only printed the bare `# kem/mceliece348864` line) restates this same provenance.

