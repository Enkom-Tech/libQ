# The remaining unregistered files (lib-q-sha3 15, lib-q-keccak-digest 5,
# lib-q-threshold-kem-lattice 4, lib-q-ml-dsa/tests/test_vectors 1, lib-q-ml-dsa/tests/wycheproof 6)
# are NOT yet registered and adding their roots here before establishing each file's origin would
# just convert an unknown into a wall of CHECK 2 failures. The lib-q-ml-dsa/tests/kats 12 that this
# line used to count are now all registered below. See card t_71d4f79a; in particular, do NOT
# register the .blb files on a filename match with RustCrypto -- 9 of them share a name with
# github.com/RustCrypto/hashes and NONE matches its bytes, and that is unexplained.
# A file is in scope if its extension (case-insensitive, without the dot) is one of these...
# ("txt" was added in the 2026-08-06 pass: the Saturnin fixture filenames end in e.g.
# "_saturninhashv2.txt", not "_kat.txt", so no filename_suffix below matched them. Checked at the
# time: lib-q-hqc/kats has zero `.txt` files, so this widening does not retroactively sweep in
# anything unexpected under the already-registered root.)
# "json" added 2026-08-07 for the ML-DSA ACVP vectors. Scoped by [scan].roots, so it does not
# sweep unrelated JSON. Note the root is the acvp-1_1_0_36 SUBdirectory, deliberately, not its
# parent -- see the ML-DSA section at the bottom for why.
# "blb" added 2026-08-09 for the TurboSHAKE vectors below. The old comment in this file (just above
# the [scan] table) used to say "9 of them share a name with github.com/RustCrypto/hashes and NONE
# matches its bytes, and that is unexplained" -- that was about
# `lib-q-sha3/tests/data/turboshake{128,256}_{6,7}.blb`, each of which was one byte short of the
# real RustCrypto file and did not decode under `blobby`. They have since been replaced with
# byte-exact copies (verified against a live, pinned RustCrypto/hashes commit) and MOVED to their
# own subdirectory, `lib-q-sha3/tests/data/turboshake/`, registered as its own root below --
# deliberately not the parent `tests/data/`, which still holds ~15 other unregistered `.blb` files
# each needing its own provenance pass before being swept in.
extensions = ["rsp", "req", "kat", "txt", "json", "blb"]
# ...or its filename (case-insensitive) ends with one of these suffixes.
# "intermediates_values" added 2026-08-09 (card t_71d4f79a, HQC half). Upstream HQC ships its
# reference intermediate-value dumps with NO file extension at all, so no `extensions` entry could
# ever reach them and they would sit outside the guard entirely -- and a [[kat]] entry alone does
# not help, because CHECK 2 rejects any manifest entry for a file discovery did not find (it reads
# as a stale entry). This suffix is deliberately the whole filename, so it sweeps in exactly those
# dumps and nothing else; `extensions` is left untouched so no extensionless file in general
# becomes a KAT candidate.
filename_suffixes = ["_kat.txt", "intermediates_values"]

