[package]
name = "lib-q-lattice-zkp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
description = "Module-lattice commitments, sigma protocols, and BLNS-style credential amortisation"
keywords = ["cryptography", "post-quantum", "lattice", "zkp", "no-std"]
categories = ["cryptography", "no-std"]


[package.metadata.cargo-machete]
ignored = [
    "lib-q-core",
    "proptest",
]
[dependencies]
lib-q-core = { path = "../lib-q-core", version = "0.0.10", default-features = false, optional = true }
# NOTE: no `features = ["std"]` here. It was unconditional, which forced lib-q-ring's std even
# in this crate's own no_std builds. That was harmless while lib-q-ring gated no_std behind an
# opt-in feature, but once ring moved to the conventional `cfg_attr(not(feature = "std"), no_std)`
# (3ee611b) it made ring a std crate in every configuration, and
# `cargo check -p lib-q-lattice-zkp --no-default-features --features no_std --target
# thumbv7em-none-eabi` failed with "can't find crate for `std` ... required by lib_q_ring because
# it does not declare #![no_std]". It was also redundant: the `std` feature below already adds
# `lib-q-ring/std` when this crate is built with std.
lib-q-ring = { path = "../lib-q-ring", version = "0.0.10", default-features = false }
lib-q-sha3 = { path = "../lib-q-sha3", version = "0.0.10", default-features = false }
lib-q-random = { path = "../lib-q-random", version = "0.0.10", optional = true, default-features = false, features = ["alloc"] }
zeroize = { workspace = true, default-features = false, features = ["derive", "alloc"] }
subtle = { workspace = true }
rand_core = { workspace = true }
hex = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

[[test]]
name = "hardened_dudect_smoke"
path = "tests/hardened_dudect_smoke.rs"
required-features = ["hardened"]

[[test]]
name = "hardened_masked_witness"
path = "tests/hardened_masked_witness.rs"
required-features = ["hardened"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
hex = { workspace = true }
criterion = { workspace = true }
lib-q-random = { path = "../lib-q-random", version = "0.0.10", features = ["std"] }
lib-q-sca-test = { path = "../lib-q-sca-test", version = "0.0.10", default-features = false, features = ["privacy"] }
proptest = { workspace = true }
rand_core = { workspace = true }

[features]
default = ["std"]
alloc = ["lib-q-ring/alloc", "lib-q-sha3/alloc"]
std = ["alloc", "lib-q-ring/std", "lib-q-random/std", "lib-q-random/secure"]
# Panic handler comes from `lib-q-ring/no_std` (do not add a second handler in this crate).
# NOTE (no_std feature is opt-in, not `not(feature = "std")`): `--no-default-features` alone is
# NOT a no_std build -- see the module doc in src/lib.rs for why the conventional
# `not(feature = "std")` shape breaks (verified on thumbv7em-none-eabi). Use
# `--no-default-features --features no_std` to actually get no_std.
no_std = ["alloc", "lib-q-ring/no_std"]
random = ["dep:lib-q-random", "lib-q-random/secure", "lib-q-random/getrandom"]
# Attested builds: structured prover loops + workspace CSPRNG (`lib-q-random` via `random`).
hardened = ["random"]
# Browser / wasm32-unknown-unknown: use JS-backed RNG when `random` is enabled.
wasm = [
    "alloc",
    "random",
    "lib-q-ring/wasm",
    "lib-q-random/wasm",
    "lib-q-random/secure",
    "dep:lib-q-core",
    "lib-q-core/wasm",
    "lib-q-core/alloc",
    "dep:wasm-bindgen",
    "dep:hex",
]

[lib]
name = "lib_q_lattice_zkp"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]

[[bench]]
name = "lattice_zkp_wire_budget"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(lattice_zkp_docs)',
    'cfg(feature, values("alloc", "std", "no_std", "random", "wasm", "hardened"))',
] }
