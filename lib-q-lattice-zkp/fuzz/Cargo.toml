[package]
name = "lib-q-lattice-zkp-fuzz"
version = "0.0.10"
edition = "2024"
rust-version = "1.96.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# `std`, not `alloc`. A libfuzzer-sys harness is a std binary, so every dependency in its graph
# must supply a panic handler, a global allocator and unwinding. Pinning these to `alloc` built
# lib-q-ring as no_std and failed with "`#[panic_handler]` function required", "no global memory
# allocator found" and "unwinding panics are not supported without std". This used to work only
# because lib-q-lattice-zkp set `features = ["std"]` on lib-q-ring unconditionally; that was
# removed so the crate could actually build no_std, which left this harness as the one consumer
# still relying on it.
lib-q-lattice-zkp = { path = "..", default-features = false, features = ["std"] }
lib-q-ring = { path = "../../lib-q-ring", version = "0.0.10", default-features = false, features = ["std"] }
libfuzzer-sys = "0.4.12"

[[bin]]
name = "lattice_zkp_verify_opening"
path = "fuzz_targets/lattice_zkp_verify_opening.rs"
test = false
doc = false
bench = false

