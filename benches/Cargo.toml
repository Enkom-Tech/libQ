[package]
name = "lib-q-benches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Benchmarks for lib-q post-quantum cryptography library"
# In-repo benchmarks only -- never published to crates.io (mirrors examples/). Required now that
# this is a workspace member: ci-guard-new-crates-and-npm.sh demands every member appear in a
# cd.yml publish matrix unless it opts out here, and it caught this immediately on the first push.
publish = false

[[bench]]
name = "lib"
path = "lib.rs"
harness = false

# These exist because lib.rs already gates every benchmark body on them. Until this package
# became a workspace member, it was never compiled by anything, so `#[cfg(feature = "ml-dsa")]`
# and `#[cfg(feature = "ml-kem")]` were always FALSE and all six benchmarks were dead code -- the
# always-false-cfg defect that ci-guard-nonexistent-feature-gates.sh exists to catch, hidden from
# it because cargo could not load this package at all. Declaring them (and defaulting them on)
# makes the benchmarks actually compile and run. lib-q is depended on with `features = ["full"]`,
# so the underlying algorithms are present either way.
[features]
default = ["ml-dsa", "ml-kem"]
ml-dsa = []
ml-kem = []

[dependencies]
# NOT `features = ["full"]`. `full` includes `wasm`, and because this package is a workspace
# member, cargo unifies its features into every workspace-wide `cargo test` -- which switched
# `wasm` on for the whole workspace and made lib-q-sig's `#[cfg(feature = "wasm")]` doctests
# compile AND RUN natively, where `js_sys` aborts the process. That turned the scheduled CI red
# on two matrix rows (lib-q-sig/src/lib.rs line 142 and ml_dsa.rs line 58) with a panic inside
# js-sys, and it was NOT obvious from this manifest that a bench dependency could do that.
# Only what the benchmarks actually exercise.
lib-q = { path = "../lib-q", version = "0.0.10", features = ["std", "ml-dsa", "ml-kem"] }

[dev-dependencies]
criterion = { workspace = true }
