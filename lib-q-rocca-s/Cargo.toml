[package]
name = "lib-q-rocca-s"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Rocca-S high-throughput AES-based AEAD (IETF draft-nakano-rocca-s) for lib-Q"
license.workspace = true
repository.workspace = true
keywords = ["cryptography", "aead", "rocca-s", "aes", "encryption"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
lib-q-core = { path = "../lib-q-core", version = "0.0.11", default-features = false }

# Optional: zeroization of key/plaintext staging buffers.
zeroize = { workspace = true, default-features = false, features = ["alloc", "derive"], optional = true }

[features]
# `simd` is in `default` so that a plain `std` build gets the constant-time hardware
# AES backend instead of the table-based scalar S-box (see `src/round.rs` module doc
# and finding F4 / card t_3d6e8d50). The `simd-*` features are runtime-dispatched
# (`runtime::has_aes()`), so enabling them on a CPU without AES-NI/ARMv8-AES is a
# harmless no-op that falls back to the scalar path — there is no correctness or
# portability cost to having them on by default.
default = ["std", "aead", "alloc", "simd"]
std = ["alloc", "lib-q-core/std"]
alloc = ["lib-q-core/alloc"]

# AEAD mode (the only mode Rocca-S provides).
aead = ["dep:zeroize"]

# Performance / constant-time: runtime-dispatched hardware AES round.
# Both backends use runtime CPU feature detection (`is_x86_feature_detected!` /
# `is_aarch64_feature_detected!`), which lives in `std::arch`, so both require `std`.
# A genuine `no_std` build (no `std` feature) CANNOT have either backend — see
# `build.rs`, which emits a `cargo:warning` making that gap loud instead of silent.
simd = ["simd-aesni", "simd-neon"]
simd-aesni = ["std"]
simd-neon = ["std"]

# Explicit zeroize toggle (also satisfies workspace `cargo metadata --features zeroize`).
zeroize = ["dep:zeroize"]

# WASM: enable getrandom/wasm_js so lib-q-core compiles for wasm32-unknown-unknown.
wasm = ["lib-q-core/wasm_getrandom"]

[lib]
bench = false
name = "lib_q_rocca_s"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "kat_tests"
path = "tests/kat_tests.rs"
required-features = ["alloc"]

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
required-features = ["alloc"]

[[test]]
name = "simd_equivalence"
path = "tests/simd_equivalence.rs"
required-features = ["alloc"]

[[test]]
name = "constant_time"
path = "tests/constant_time.rs"
required-features = ["alloc", "aead"]

[[bench]]
name = "rocca_s_criterion_benches"
harness = false
required-features = ["alloc"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(eurydice)',
    'cfg(doc_cfg)',
    'cfg(target_arch, values("wasm32"))',
] }
