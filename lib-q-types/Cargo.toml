[package]
name = "lib-q-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Algorithm identifiers and categories shared across lib-Q crates"
keywords = ["cryptography", "post-quantum"]
categories = ["cryptography", "no-std"]

[dependencies]
serde = { workspace = true, optional = true, features = ["derive"], default-features = false }
wasm-bindgen = { workspace = true, optional = true, features = ["serde-serialize"] }
# `lib-q-fn-dsa-comm` has no dependency on `lib-q-types`/`lib-q-core` (only `rand_core` +
# `cpufeatures`), so depending on it here is acyclic. It lets `FNDSA*_*_KEY_BYTES` below be
# genuinely derived (`const fn` evaluated at compile time) instead of a hand-maintained literal
# table -- the class of bug this module exists to close (see `lib-q-core`'s FN-DSA-1024 history).
lib-q-fn-dsa-comm = { path = "../lib-q-fn-dsa/fn-dsa-comm", version = "0.0.10", default-features = false }

[features]
default = []
serde = ["dep:serde"]
wasm = ["dep:wasm-bindgen", "serde"]

[lib]
name = "lib_q_types"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(eurydice)',
    'cfg(doc_cfg)',
] }
