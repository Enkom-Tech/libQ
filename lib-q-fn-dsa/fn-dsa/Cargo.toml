[package]
name = "lib-q-fn-dsa-alg"
version = "0.0.12"
authors.workspace = true
categories.workspace = true
description = "FN-DSA algorithm facade (lib-Q; not the crates.io `fn-dsa` package by pornin)"
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
autobenches = false

[lib]
name = "fn_dsa"
bench = false

[dependencies]
lib-q-fn-dsa-comm = { version = "0.0.12", path = "../fn-dsa-comm" }
lib-q-fn-dsa-kgen = { version = "0.0.12", path = "../fn-dsa-kgen" }
lib-q-fn-dsa-sign = { version = "0.0.12", path = "../fn-dsa-sign" }
lib-q-fn-dsa-vrfy = { version = "0.0.12", path = "../fn-dsa-vrfy" }

[dev-dependencies]
hex = { workspace = true }
# `tests/upstream_oracle_kat.rs` implements the upstream KAT harness's fake RNGs, which needs the
# `TryRng`/`TryCryptoRng`/`Infallible` items that `fn_dsa` itself does not re-export.
lib-q-fn-dsa-comm = { version = "0.0.12", path = "../fn-dsa-comm" }

[features]
default = []
no_avx2 = ["lib-q-fn-dsa-comm/no_avx2", "lib-q-fn-dsa-kgen/no_avx2", "lib-q-fn-dsa-sign/no_avx2", "lib-q-fn-dsa-vrfy/no_avx2"]
# Forward fn-dsa-sign's FPU-divide/sqrt mitigation: neither is on by cargo default
# (perf cost measured ~35-45% on sign(), see lib-q-fn-dsa/SECURITY.md), but both must reach a
# *tested* configuration through this facade -- see the `fn-dsa-div-sqrt-emu` CI job.
div_emu = ["lib-q-fn-dsa-sign/div_emu"]
sqrt_emu = ["lib-q-fn-dsa-sign/sqrt_emu"]
shake256x4 = ["lib-q-fn-dsa-comm/shake256x4", "lib-q-fn-dsa-kgen/shake256x4", "lib-q-fn-dsa-sign/shake256x4"]

[[bench]]
name = "keygen"
path = "benches/keygen.rs"
harness = false

[[bench]]
name = "sign"
path = "benches/sign.rs"
harness = false

[[bench]]
name = "verify"
path = "benches/verify.rs"
harness = false
