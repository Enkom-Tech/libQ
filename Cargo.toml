    "lib-q-aead",
    "lib-q-duplex-aead",
    "lib-q-hpke",
    "lib-q-rocca-s",
    "lib-q-romulus",
    "lib-q-saturnin",
    "lib-q-tweak-aead",
    # consumer-protocol-agnostic advanced primitives (opt-in; pre-standard cores marked PROVISIONAL)
    "lib-q-mac",
    "lib-q-blind-pcs",
    "lib-q-dkg",
    "lib-q-threshold-raccoon",
    "lib-q-threshold-kem-lattice",
    "lib-q-blind-token",
    "lib-q-maul",
    # ZKP & lattice
    "lib-q-lattice-zkp",
    "lib-q-mve",
    "lib-q-prf",
    "lib-q-ring",
    "lib-q-transcript",
    "lib-q-zk-encryption-proof",
    "lib-q-zkp",
    # STARK
    "lib-q-stark",
    "lib-q-stark-air",
    "lib-q-stark-baby-bear",
    "lib-q-stark-challenger",
    "lib-q-stark-commit",
    "lib-q-stark-dft",
    "lib-q-stark-field",
    "lib-q-stark-field-testing",
    "lib-q-stark-fri",
    "lib-q-stark-interpolation",
    "lib-q-stark-matrix",
    "lib-q-stark-mds",
    "lib-q-stark-merkle",
    "lib-q-stark-mersenne31",
    "lib-q-stark-monty31",
    "lib-q-stark-rayon",
    "lib-q-stark-shake128",
    "lib-q-stark-shake256",
    "lib-q-stark-sha3-256",
    "lib-q-stark-symmetric",
    "lib-q-stark-util",
    # Plonky & hash gadgets
    "lib-q-plonky",
    "lib-q-plonky-batch-stark",
    "lib-q-plonky-keccak-air",
    "lib-q-plonky-lookup",
    "lib-q-plonky-multilinear-util",
    "lib-q-plonky-uni-stark",
    "lib-q-poseidon",
    # Testing & tooling
    "lib-q-sca-test",
    # Examples
    "examples",
    "examples/wasm-browser-demo",
    # Benchmarks
    "benches",
]
# Standalone cargo-fuzz harnesses (not workspace members).
exclude = [
    "lib-q-zkp/fuzz",
    "lib-q-lattice-zkp/fuzz",
    "lib-q-ring-sig/fuzz",
    "lib-q-prf/fuzz",
    "lib-q-dkg/fuzz",
    "lib-q-threshold-raccoon/fuzz",
]
# Also outside the workspace: `benches/` (standalone Criterion runner) and
# `lib-q-fn-dsa/fn-dsa-*` (nested path deps under `lib-q-fn-dsa`).
resolver = "3"

[workspace.package]
authors = ["Enkom Tech", "Nexlab-One"]
license = "Apache-2.0"
homepage = "https://github.com/Enkom-Tech/libQ"
edition = "2024"
repository = "https://github.com/Enkom-Tech/libQ"
readme = "README.md"
version = "0.0.11"
rust-version = "1.96.0"
description = "Post-quantum cryptography library"
keywords = ["cryptography", "post-quantum", "security", "wasm"]
categories = ["cryptography", "wasm"]

[workspace.dependencies]
# Misc
hax-lib = "0.3.7"
blobby = "0.4.0"
# WASM
wasm-bindgen = "0.2.127"
js-sys = "0.3.104"
web-sys = "0.3.104"
wasm-bindgen-test = "0.3.77"
# no_std support (lazy statics without std::sync::OnceLock; f64 math without std intrinsics)
once_cell = { version = "1.21.4", default-features = false }
libm = { version = "0.2.16", default-features = false }
# Crypto & security
zeroize = { version = "1.9.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }
hybrid-array = { version = "0.4.14", features = ["zeroize"] }
digest = "0.11.3"
sha2 = { version = "0.11.0", default-features = false }
block-buffer = "0.12.1"
aead = { version = "0.6.1", default-features = false }
aes = { version = "0.9.2", default-features = false }
crypto-bigint = { version = "0.7.5", default-features = false }
# RNG & entropy
rand_core = { version = "0.10.1", default-features = false }
rand = { version = "0.10.2", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
# Serialization
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false }
serde-wasm-bindgen = "0.6.5"
postcard = { version = "1.1.3", default-features = false }
# Testing & dev
criterion = "0.8.2"
hex = "0.4.3"
hex-literal = "1.1.0"
proptest = "1.11.0"
cpufeatures = "0.3.0"
# Errors & diagnostics
thiserror = { version = "2.0.20", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }
# STARK / proof-system
itertools = { version = "0.15.0", default-features = false, features = ["use_alloc"] }
num-bigint = { version = "0.5.1", default-features = false }
num-traits = "0.2.19"
pastey = "0.2.3"
spin = "0.12.2"
transpose = "0.2.3"
rayon = "1.12.0"
base16ct = { version = "1.0.0", features = ["alloc"] }

# CI profiles — faster `cargo test` linking without changing release artifact settings.
[profile.release-ci]
inherits = "release"
lto = false
codegen-units = 256
# Pinned explicitly, NOT inherited-and-corrected: nothing in this workspace defines
# `[profile.release]`, and the tracked `.cargo/config.toml` has no `[profile]` section at all, so
# `release` is cargo's default — which is already `panic = "unwind"`. This line is therefore a
# no-op today and exists only to keep `cargo test --profile release-ci` linkable if someone later
# adds `[profile.release] panic = "abort"`: the lib test harness links workspace crates built as
# mixed rustc outputs (e.g. `lib-q-utils`, `lib-q-core`), and abort in dependencies is rejected
# when the test crate is unwind. Do not delete it, and do not read it as evidence that some other
# file sets abort.
panic = "unwind"
# Avoid incremental + `lib-q-core` fingerprint races that surface as E0460
# ("possibly newer version of crate `lib_q_core`") when downstream rlibs link the unsuffixed
# `liblib_q_core.rlib` companion artefact.
incremental = false

[profile.release-security]
inherits = "release"
panic = "abort"

[profile.dev-security]
inherits = "dev"
panic = "unwind"

[profile.dev-no-std]
inherits = "dev"
panic = "abort"

# Crate-specific profiles
# NOTE: lib-q-blind-token's secure instance does heavy f64 (canonical-embedding perturbation
# sampler, per-slot Cholesky), large-modulus NTT, and millions of RNG draws per keygen; at
# opt-level 0 a single keygen takes minutes. It is now covered by the per-package opt-level
# overrides below ([profile.dev.package]), which — verified via `cargo --unit-graph` on
# nightly-2026-07-24 — DO apply to the root crate being tested as well as to dependencies
# (the test profile inherits dev's package overrides). An earlier comment here claimed the
# opposite; that claim was wrong for this toolchain.
[profile.dev-cb-kem]
inherits = "dev"
opt-level = 1 # reduces runtime for KATNUM=2 from 281s to 11s

[profile.release-cb-kem]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev-fn-dsa]
inherits = "dev"
opt-level = 0
debug = true
lto = false
panic = "unwind"

[profile.release-fn-dsa]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# ---------------------------------------------------------------------------------------------
# Per-package opt-level for the mathematical cores — makes `cargo test --workspace` runnable.
#
# Measured 2026-07-28 (Windows dev host, nightly-2026-07-24, warm cache): at dev/test opt-level 0
# the workspace test gate does not terminate in practical time. Examples (test binary wall time):
#   lib-q (umbrella) unit tests            > 420 s (killed)
#   lib-q-slh-dsa / lib-q-fn-dsa unit      >  90 s each (killed)
#   lib-q-blind-token budget_gates         >  90 s (killed)
#   lib-q-sig crypto_operations_tests      >  90 s (killed)
#   lib-q-lattice-zkp / lib-q-zkp unit     >  90 s each (killed)
#   lib-q-hqc simd_correctness             >  90 s (killed)
#   lib-q-zk-encryption-proof unit         >  90 s (killed)
# The hot code is the crypto math itself: Keccak-f permutations (under SLH-DSA, SHAKE, K12, HQC,
# the RNGs), NTT / lattice keygen and proofs, and STARK proving. At opt-level 2 the same binaries
# finish in seconds (see the commit introducing this block for the full before/after table).
#
# Mechanism: per-package overrides raise ONLY `opt-level`. `debug-assertions` and
# `overflow-checks` are deliberately NOT overridden — they inherit from dev/test and stay ON,
# including the #[cfg(debug_assertions)] constraint checkers inside the STARK/plonky provers.
# Verified via `cargo test --workspace --unit-graph`: a `[profile.dev.package.X]` override reaches
# X both as a dependency and as the crate under test (the test profile inherits dev's package
# overrides), so this covers `cargo test -p X` and every dependent's tests.
#
# Deliberately NOT listed (kept at opt-level 0 for debuggability): thin API / type / util /
# provider crates — lib-q, lib-q-core, lib-q-sig, lib-q-kem, lib-q-types, lib-q-utils,
# lib-q-random, the AEADs, lib-q-transcript, ... Their tests are fast once the math they call is
# optimized. If a new crate with heavy in-crate math is added, add it here.
#
# CAUTION for maintainers of wall-clock timing tests (lib-q-k12/tests/constant_time.rs,
# lib-q-sha3 constant_time/performance, the hardened_dudect_smoke tests, lib-q-sca-test):
# these overrides change the codegen those tests measure (faster and less noisy than opt0 —
# closer to what ships, but a different timing regime than unoptimized debug).

# All external (non-workspace) dependencies: rand, sha2, hmac, crypto-bigint, proptest, ...
# The "*" spec never matches workspace members, so workspace crates keep their dev settings
# unless listed explicitly below.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package]
# Hash cores — Keccak-f is the shared substrate under almost every slow suite above.
"lib-q-keccak" = { opt-level = 2 }
"lib-q-sha3" = { opt-level = 2 }
"lib-q-keccak-digest" = { opt-level = 2 }
"lib-q-k12" = { opt-level = 2 }
"lib-q-hash" = { opt-level = 2 }
"lib-q-poseidon" = { opt-level = 2 }
# Algorithm cores with heavy in-crate math.
"lib-q-ml-kem" = { opt-level = 2 }
"lib-q-ml-dsa" = { opt-level = 2 }
"lib-q-slh-dsa" = { opt-level = 2 }
"lib-q-fn-dsa" = { opt-level = 2 }
"lib-q-hqc" = { opt-level = 2 }
"lib-q-cb-kem" = { opt-level = 2 }
# Lattice / threshold / proof protocol crates (math lives in-crate; the set CI's rust-test
# action skips in debug, plus the ones measured slow above).
"lib-q-blind-token" = { opt-level = 2 }
"lib-q-dkg" = { opt-level = 2 }
"lib-q-threshold-raccoon" = { opt-level = 2 }
"lib-q-threshold-kem-lattice" = { opt-level = 2 }
"lib-q-lattice-zkp" = { opt-level = 2 }
"lib-q-ring" = { opt-level = 2 }
"lib-q-ring-sig" = { opt-level = 2 }
"lib-q-mve" = { opt-level = 2 }
"lib-q-zkp" = { opt-level = 2 }
"lib-q-zk-encryption-proof" = { opt-level = 2 }
# STARK / plonky proving stack (hot dependencies of lib-q-zkp, lib-q-zk-encryption-proof,
# lib-q-mve; kept as one coherent unit).
"lib-q-stark" = { opt-level = 2 }
"lib-q-stark-air" = { opt-level = 2 }
"lib-q-stark-baby-bear" = { opt-level = 2 }
"lib-q-stark-challenger" = { opt-level = 2 }
"lib-q-stark-commit" = { opt-level = 2 }
"lib-q-stark-dft" = { opt-level = 2 }
"lib-q-stark-field" = { opt-level = 2 }
"lib-q-stark-field-testing" = { opt-level = 2 }
"lib-q-stark-fri" = { opt-level = 2 }
"lib-q-stark-interpolation" = { opt-level = 2 }
"lib-q-stark-matrix" = { opt-level = 2 }
"lib-q-stark-mds" = { opt-level = 2 }
"lib-q-stark-merkle" = { opt-level = 2 }
"lib-q-stark-mersenne31" = { opt-level = 2 }
"lib-q-stark-monty31" = { opt-level = 2 }
"lib-q-stark-rayon" = { opt-level = 2 }
"lib-q-stark-shake128" = { opt-level = 2 }
"lib-q-stark-shake256" = { opt-level = 2 }
"lib-q-stark-sha3-256" = { opt-level = 2 }
"lib-q-stark-symmetric" = { opt-level = 2 }
"lib-q-stark-util" = { opt-level = 2 }
"lib-q-plonky" = { opt-level = 2 }
"lib-q-plonky-batch-stark" = { opt-level = 2 }
"lib-q-plonky-keccak-air" = { opt-level = 2 }
"lib-q-plonky-lookup" = { opt-level = 2 }
"lib-q-plonky-multilinear-util" = { opt-level = 2 }
"lib-q-plonky-uni-stark" = { opt-level = 2 }
# FN-DSA nested path deps (outside the workspace; predate this block — FN-DSA signing and
# keygen at high logn are unusably slow without LLVM optimization). Kept explicit for
# documentation even though the "*" spec above would now cover them.
"lib-q-fn-dsa-alg" = { opt-level = 2 }
"lib-q-fn-dsa-comm" = { opt-level = 2 }
"lib-q-fn-dsa-kgen" = { opt-level = 2 }
"lib-q-fn-dsa-sign" = { opt-level = 2 }
"lib-q-fn-dsa-vrfy" = { opt-level = 2 }

# Root crate of `cargo test -p lib-q-fn-dsa-alg` uses the test profile for the library.
[profile.test.package."lib-q-fn-dsa-alg"]
opt-level = 2

# crates.io proc-macro-error2 2.0.1 hits E0365 (private `proc_macro` re-export;
# rust-lang/rust#127909). Vendored copy matches upstream 2.0.1 sources with
# `pub extern crate proc_macro` so nested `pub use proc_macro` in `__export` is legal.
#
# Re-justified at the 0.0.11 release (2026-08-12). Do NOT drop this patch on the strength of a
# green build: on rustc 1.99.0-nightly the registry copy now COMPILES, because E0365 was demoted
# to a future-incompatibility lint. It is the same defect, not a fixed one — `cargo report
# future-incompatibilities` names E0365 at proc-macro-error2-2.0.1/src/lib.rs:494 and says it
# "will become a hard error in a future release", with rustc suggesting exactly the
# `pub extern crate proc_macro` line this vendor carries. Upstream is still 2.0.1 (crates.io
# max_stable == newest), so there is no release to move to. Reachable from lib-q-ml-dsa via
# hax-lib -> hax-lib-macros, i.e. a published path, not a dev-only one.
[patch.crates-io]
proc-macro-error2 = { path = "vendor/proc-macro-error2" }
# Vendored to disable clap's `color` feature (→ unmaintained atty/ansi_term). See
# vendor/dudect-bencher/Cargo.toml. Dev/bench-only (lib-q-dkg ct_dudect bench).
#
# Re-justified at the 0.0.11 release (2026-08-12): upstream is still 0.7.0 (crates.io
# max_stable == newest) and its manifest still declares `clap ^2` with default features on, so
# the advisory path is unchanged. The patch demonstrably works — `atty` and `ansi_term` each
# appear 0 times in Cargo.lock, and clap 2.34.0 resolves with only bitflags/strsim/textwrap/
# unicode-width/vec_map. Drop this only once dudect-bencher migrates off EOL clap 2.
dudect-bencher = { path = "vendor/dudect-bencher" }
