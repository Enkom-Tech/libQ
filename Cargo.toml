    "lib-q-core",
    "lib-q-intrinsics",
    "lib-q-platform",
    "lib-q-random",
    "lib-q-types",
    "lib-q-utils",
    # Hash & digest
    "lib-q-hash",
    "lib-q-k12",
    "lib-q-keccak",
    "lib-q-keccak-digest",
    "lib-q-sha3",
    # KEM
    "lib-q-cb-kem",
    "lib-q-hqc",
    "lib-q-hqc/traits",
    "lib-q-kem",
    "lib-q-ml-kem",
    # Signatures
    "lib-q-fn-dsa",
    "lib-q-mayo",
    "lib-q-ml-dsa",
    "lib-q-ring-sig",
    "lib-q-sig",
    "lib-q-slh-dsa",
