[toolchain]
# Exact stable release, pinned deliberately so rustfmt and clippy cannot change under us.
# Bump it in its own PR for each Rust release, running `cargo fmt --all` and
# `cargo clippy --workspace --all-targets --all-features -- -D warnings` in the same PR.
# Nightly is used only by the dated-nightly CI jobs (Keccak portable-SIMD, cargo-fuzz).
channel = "1.99.1"
components = ["rustfmt", "clippy", "rust-src"]
targets = [
    "wasm32-unknown-unknown",
    "thumbv7em-none-eabi",
    "aarch64-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
]
