[package]
name = "lib-q-saturnin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Saturnin post-quantum symmetric algorithm suite for lib-Q"
license.workspace = true
repository.workspace = true
keywords = ["cryptography", "post-quantum", "saturnin", "aead", "block-cipher"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
lib-q-core = { path = "../lib-q-core", version = "0.0.10", default-features = false }

# Optional dependencies for specific features
zeroize = { workspace = true, default-features = false, features = ["alloc", "derive"], optional = true }

[features]
# `qcb` is deliberately NOT default. QCB is nonce-catastrophic — a single nonce repeat is a
# universal forgery, not merely a keystream leak: reproduced in tests/nonce_misuse.rs
# (`qcb_nonce_reuse_is_a_universal_forgery`, three chosen-plaintext queries at one repeated
# nonce forge a valid ciphertext for a chosen, never-queried 64-byte plaintext), with a
# distinct-nonce negative control and a CTR-Cascade contrast control in the same file. (The
# similarly-named lib-q-aead/tests/nonce_misuse.rs is a different file in a different crate —
# it measures keystream-leak magnitude across the AEAD registry, not QCB, and contains no
# forgery.) As of 2026-08-06 QCB also has zero consumers: every product (GIP, uGrid, My-Grid,
# Bitlink) reaches
# Saturnin through `SaturninAead` (CTR-Cascade), which degrades gracefully instead. A
# default-on mode with that failure mode and no callers is liability, so it is opt-in.
# The mode is kept, not deprecated: its rate-1 structure (one TBC call per block, and
# tweaks that carry the block index so blocks are independent) is the reason it is a
# candidate for the Saturnin hardware programme, where CTR-Cascade's serial MAC chain
# caps throughput regardless of area.
default = ["std", "aead", "block-cipher", "hash", "stream", "alloc"]
std = ["alloc", "lib-q-core/std"]
alloc = ["lib-q-core/alloc"]

# Algorithm modes
aead = ["dep:zeroize"]
aead-short = ["dep:zeroize"]
# Saturnin-QCB one-pass AEAD (tweakable-block-cipher mode from the update note).
# Implies `hash`: QCB's tag is the CTX committing transform (Chan-Rogaway, ESORICS 2022)
# instantiated with Saturnin-Hash (see src/commit.rs) — the mode cannot compile without it.
qcb = ["dep:zeroize", "hash"]
block-cipher = []
hash = []
stream = ["dep:zeroize"]

# Performance optimizations
simd = ["simd-avx2", "simd-neon"]
simd-avx2 = ["std"]
simd-neon = []
parallel = []

# Security features
zeroize = ["dep:zeroize"]

# WASM: enable getrandom/wasm_js so lib-q-core (and getrandom) compile for wasm32-unknown-unknown
wasm = ["lib-q-core/wasm_getrandom"]

[lib]
bench = false
name = "lib_q_saturnin"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
required-features = ["alloc"]

[[test]]
name = "kat_tests"
path = "tests/kat_tests.rs"
required-features = ["alloc"]

[[test]]
name = "key_commitment"
path = "tests/key_commitment.rs"
required-features = ["alloc", "qcb"]

[[test]]
name = "nonce_misuse"
path = "tests/nonce_misuse.rs"
required-features = ["alloc", "qcb", "aead"]

[[test]]
name = "qcb_spec"
path = "tests/qcb_spec.rs"
required-features = ["alloc", "qcb"]

[[test]]
name = "qcb_ctx_spec"
path = "tests/qcb_ctx_spec.rs"
required-features = ["alloc", "qcb"]

[[test]]
name = "aead_kat_pin"
path = "tests/aead_kat_pin.rs"
required-features = ["alloc", "aead"]

[[test]]
name = "cascade_ctx_spec"
path = "tests/cascade_ctx_spec.rs"
required-features = ["alloc", "aead", "hash"]

[[test]]
name = "core_equivalence"
path = "tests/core_equivalence.rs"
required-features = ["alloc"]

[[test]]
name = "constant_time"
path = "tests/constant_time.rs"
required-features = ["alloc", "aead"]

[[test]]
name = "coverage_api"
path = "tests/coverage_api.rs"
required-features = ["alloc"]

[[test]]
name = "simd_equivalence"
path = "tests/simd_equivalence.rs"
required-features = ["alloc"]

[[bench]]
name = "saturnin_criterion_benches"
harness = false
required-features = ["alloc"]

[[bench]]
name = "qcb_ctx_overhead"
harness = false
required-features = ["alloc", "qcb", "aead"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(eurydice)',
    'cfg(doc_cfg)',
    'cfg(target_arch, values("wasm32"))',
] }
