version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
      - "security"
    ignore:
      # Ignore major version updates for critical dependencies
      - dependency-name: "getrandom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zeroize"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rand_core"
        update-types: ["version-update:semver-major"]

  # GitHub Actions.
  #
  # `directories` (plural), not `directory`: with only "/" dependabot scans
  # .github/workflows/ and does NOT see composite actions under
  # .github/actions/*/action.yml. That blind spot is why
  # .github/actions/rust-test/action.yml sat on `taiki-e/install-action@v2`
  # while PR #87 bumped the four workflow-file references and left it behind.
  #
  # Third-party actions here are pinned to immutable commit SHAs with a trailing
  # `# <tag>` comment; dependabot understands that form and bumps both together.
  # Branch refs (`@master`, `@stable`, `@nightly`) must not be reintroduced --
  # they let the action author push code into CI, including the CD job that
  # holds a crates.io token.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "automation"

  # NPM dependencies (WASM browser demo; per-crate `pkg/` trees are build artifacts, not roots)
  - package-ecosystem: "npm"
    directory: "/examples/wasm-browser-demo"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "wasm"
    ignore:
      # Ignore major version updates for critical tooling
      - dependency-name: "wasm-pack"
        update-types: ["version-update:semver-major"]
