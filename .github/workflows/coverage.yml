# Comprehensive Test Coverage Workflow
# 
# This workflow runs a full coverage analysis on the main branch and generates
# coverage reports and badges. It complements the PR workflow which does a more
# targeted coverage check.
#
# For PR validation coverage, see the test-coverage job in pr.yml

name: Test Coverage

on:
  # Run on main branch pushes for badge updates
  push:
    branches: [main]
  # Run on pull requests to catch coverage regressions early
  pull_request:
    branches: [main]
    paths:
      # Only run full coverage on PRs that modify these critical paths
      - 'lib-q-keccak/**'
      - 'lib-q-core/**'
      - 'lib-q-ml-dsa/**'
      - 'scripts/run-coverage.sh'
      - '.github/workflows/coverage.yml'
  # Schedule a weekly coverage report for monitoring
  schedule:
    - cron: '0 0 * * 0'  # Run at midnight on Sundays

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  COVERAGE_THRESHOLD: "70"

permissions:
  # Least-privilege default; jobs that need more elevate locally (e.g. coverage badge commit).
  contents: read

jobs:
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    # Backstop so a pathologically slow workspace pass can't hold a runner for the default 6h.
    # The gating per-crate step (~65m) + the bounded workspace pass (40m, below) + setup fit well under this.
    timeout-minutes: 150
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # `nightly` is PINNED to 2026-08-05, the last date this job passed. Unpin it when
        # cargo-tarpaulin can parse current nightly again -- track with card t_93dc6b27.
        #
        # Why: from 2026-08-06 onward every run of this job died with
        #   ERROR cargo_tarpaulin: parser failure: Nom(Satisfy)
        # before running a single test. Attributed, not guessed:
        #   * `stable` passed throughout, so it is not the repo's source.
        #   * Re-running the Aug-5 commit 6c3fcf80 -- which passed on Aug 5 -- against that day's
        #     nightly reproduced the identical error on identical source, so it is not any change
        #     we made.
        #   * Both the passing Aug-5 run and the failing runs installed cargo-tarpaulin 0.37.0, so
        #     tarpaulin did not move either. The only remaining variable is the nightly toolchain.
        #
        # ROOT CAUSE, established 2026-08-09 -- no longer "by elimination". Reproduced locally with
        # a THREE-LINE crate (one fn, one test), which rules out this repo entirely:
        #   $ cargo +nightly tarpaulin --engine llvm      # rustc 1.99.0-nightly (771916f90)
        #   ERROR llvm_profparser::instrumentation_profile::raw_profile:
        #         consistency check for reading counts failed
        #   ERROR cargo_tarpaulin: parser failure: Nom(Satisfy)
        # The `Nom(Satisfy)` is a symptom; the parser is choking on the .profraw FORMAT VERSION:
        #   stable  (rustc 1.96.0, LLVM 22.1.2) -> profraw header version 0x0a (10)  -> parses
        #   nightly (rustc 1.99.0, LLVM 23.1.0) -> profraw header version 0x0b (11)  -> fails
        # LLVM 23 bumped INSTR_PROF_RAW_VERSION to 11 and tarpaulin's llvm-profparser does not yet
        # read v11. So this is upstream in llvm-profparser, and it unblocks when a cargo-tarpaulin
        # release ships v11 support -- not on any date-based guess. As of 2026-08-09 no issue for
        # it exists on xd009642/tarpaulin or xd009642/llvm-profparser, and 0.37.0 (2026-07-04) is
        # still the latest release, so nobody upstream is tracking it yet.
        #
        # DO NOT "fix" this by switching the nightly row to `--engine ptrace`. That engine DOES
        # succeed on current nightly (verified in the same probe), so it is a tempting one-line
        # unpin -- but ptrace and llvm are different measurement engines that report different
        # numbers for the same crate, so the nightly row would stop being comparable to the floors,
        # which are all calibrated against llvm. That trades a visibly pinned job for a silently
        # wrong one.
        #
        # Pinned rather than marked continue-on-error deliberately: a job that cannot fail is the
        # exact defect this repo has spent weeks removing (see ci-guard-no-vacuous-tests.sh). A
        # pinned nightly still runs every test and still fails on a real regression; it just stops
        # re-reporting an upstream incompatibility as if it were ours. The cost is that this job no
        # longer gives early warning of genuine nightly breakage, which is why it must be unpinned
        # rather than left this way.
        rust: [stable, nightly-2026-08-05]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-16
        with:
          toolchain: ${{ matrix.rust }}
          # llvm-tools-preview: LLVM coverage merge (tarpaulin --engine llvm on Linux)
          components: rustfmt, clippy, llvm-tools-preview

      - name: Toolchain fingerprint (cache)
        id: toolchain-fp
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            echo "hash=$(rustc -vV | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          else
            echo "hash=$(rustc -vV | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ matrix.rust }}-${{ steps.toolchain-fp.outputs.hash }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          
      - name: Install tarpaulin
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          # Pinned. Previously `cargo-tarpaulin` (i.e. @latest), which meant an upstream release
          # could break this job with no change on our side -- the same failure shape as the
          # nightly incompatibility documented on the matrix above, just from the other
          # unpinned input. 0.37.0 (2026-07-04) is both the newest release and the version the
          # last passing run used, so this pins the status quo rather than rolling anything back.
          # Bump deliberately, together with the nightly unpin (card t_93dc6b27).
          tool: cargo-tarpaulin@0.37.0
          
      # First run coverage for individual critical crates
      - name: Run coverage for core cryptographic crates
        run: |
          # Create directory for combined reports (cp -r does not create parent dirs)
          mkdir -p combined-coverage \
            "combined-coverage/${{ matrix.rust }}/core" \
            "combined-coverage/${{ matrix.rust }}/crypto" \
            "combined-coverage/${{ matrix.rust }}/utils" \
            "combined-coverage/${{ matrix.rust }}/full"
          
          # Define critical cryptographic crates.
          # DELIBERATELY absent: the heavy lattice crates (lib-q-dkg, lib-q-threshold-raccoon,
          # lib-q-threshold-kem-lattice, lib-q-blind-token) — their keygen is far too slow under
          # debug tarpaulin (this step builds debug). lib-q-threshold-kem-lattice gets a scoped
          # RELEASE tarpaulin gate in security-critical-coverage.yml instead.
          CORE_CRATES="lib-q-core lib-q-keccak lib-q-hash lib-q-sha3 lib-q-keccak-digest lib-q-k12"
          CRYPTO_CRATES="lib-q-kem lib-q-ml-kem lib-q-ml-dsa lib-q-sig lib-q-aead lib-q-hpke lib-q-fn-dsa lib-q-cb-kem"
          UTIL_CRATES="lib-q-platform lib-q-intrinsics lib-q-utils lib-q-zkp"
          
          # Run coverage for core cryptographic components
          echo "Running coverage for core cryptographic components with ${{ matrix.rust }}"
          for crate in $CORE_CRATES; do
            if [ -d "$crate" ]; then
              echo "Running coverage for $crate"
              CRATE_THRESH="$COVERAGE_THRESHOLD"
              case "$crate" in
                lib-q-core) CRATE_THRESH="78" ;; # match PR test-coverage (docs/coverage-scope.md)
                lib-q-keccak) CRATE_THRESH="65" ;;
              esac
              bash scripts/run-coverage.sh --crate "$crate" --threshold $CRATE_THRESH --output-dir "coverage-$crate" --toolchain ${{ matrix.rust }}
              
              # Copy reports to combined directory for artifact upload
              cp -r "coverage-$crate" "combined-coverage/${{ matrix.rust }}/core/$crate"
            fi
          done
          
          # Run coverage for cryptographic algorithm implementations
          echo "Running coverage for cryptographic algorithm implementations with ${{ matrix.rust }}"
          for crate in $CRYPTO_CRATES; do
            if [ -d "$crate" ]; then
              echo "Running coverage for $crate"
              CRATE_THRESH="$COVERAGE_THRESHOLD"
              case "$crate" in
                lib-q-ml-dsa) CRATE_THRESH="60" ;;
                lib-q-fn-dsa) CRATE_THRESH="68" ;; # keygen+sign+verify measured; calibrated backstop
                lib-q-kem) CRATE_THRESH="65" ;;
                lib-q-sig) CRATE_THRESH="66" ;;
                lib-q-aead) CRATE_THRESH="68" ;;
                lib-q-hpke) CRATE_THRESH="66" ;;
                lib-q-cb-kem) CRATE_THRESH="68" ;;
              esac
              bash scripts/run-coverage.sh --crate "$crate" --threshold $CRATE_THRESH --output-dir "coverage-$crate" --toolchain ${{ matrix.rust }}
              
              # Copy reports to combined directory for artifact upload
              cp -r "coverage-$crate" "combined-coverage/${{ matrix.rust }}/crypto/$crate"
            fi
          done

          # Informational: ML-DSA with simd256 (includes AVX2 sources). x86_64 runners only; not gated.
          if [ "${{ matrix.rust }}" = "stable" ] && [ -d "lib-q-ml-dsa" ]; then
            echo "Running informational SIMD256 coverage for lib-q-ml-dsa"
            bash scripts/run-coverage.sh --crate lib-q-ml-dsa --ml-dsa-simd256 --threshold 0 --output-dir "coverage-lib-q-ml-dsa-simd256" --toolchain ${{ matrix.rust }} --no-report
            mkdir -p "combined-coverage/${{ matrix.rust }}/crypto/lib-q-ml-dsa-simd256"
            cp -r "coverage-lib-q-ml-dsa-simd256" "combined-coverage/${{ matrix.rust }}/crypto/lib-q-ml-dsa-simd256"
          fi
          
          # Run coverage for utility crates
          echo "Running coverage for utility crates with ${{ matrix.rust }}"
          for crate in $UTIL_CRATES; do
            if [ -d "$crate" ]; then
              echo "Running coverage for $crate"
              UTIL_THRESH="70"
              case "$crate" in
                lib-q-zkp) UTIL_THRESH="65" ;;
              esac
              bash scripts/run-coverage.sh --crate "$crate" --threshold $UTIL_THRESH --output-dir "coverage-$crate" --toolchain ${{ matrix.rust }}
              
              # Copy reports to combined directory for artifact upload
              cp -r "coverage-$crate" "combined-coverage/${{ matrix.rust }}/utils/$crate"
            fi
          done
      
      # Aggregate workspace report for badges/artifacts only (denominator is entire repo; do not gate on this %).
      # This pass instruments the WHOLE workspace under tarpaulin in debug — including the large STARK/plonky3
      # suite and slow crypto crates (blind-token/fn-dsa keygen) added in the 0.0.8 cycle — so it can run for
      # hours. It is purely informational (badge/artifact); the real gate is the per-crate step above, which
      # stays fatal. Bound it and never let it fail the workflow: a slow/incomplete badge must not turn a green
      # gated run red. On timeout the badge step falls back to a 0% reading (see Extract coverage percentage).
      - name: Run coverage for entire workspace
        timeout-minutes: 40
        continue-on-error: true
        run: |
          bash scripts/run-coverage.sh --threshold 0 --output-dir "coverage-full" --toolchain ${{ matrix.rust }}
          
          # Copy to combined directory
          cp -r "coverage-full" "combined-coverage/${{ matrix.rust }}/full"
          
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-${{ matrix.rust }}
          path: combined-coverage/
          
      - name: Extract coverage percentage
        id: extract-coverage
        run: |
          set -euo pipefail
          if COVERAGE=$(bash scripts/extract-coverage-percent.sh coverage-full); then
            echo "percentage=${COVERAGE}" >> $GITHUB_OUTPUT
            if awk -v c="${COVERAGE}" 'BEGIN { exit !(c + 0 < 50) }'; then
              echo "color=red" >> $GITHUB_OUTPUT
            elif awk -v c="${COVERAGE}" 'BEGIN { exit !(c + 0 < 60) }'; then
              echo "color=yellow" >> $GITHUB_OUTPUT
            else
              echo "color=green" >> $GITHUB_OUTPUT
            fi
          else
            echo "percentage=0" >> $GITHUB_OUTPUT
            echo "color=red" >> $GITHUB_OUTPUT
          fi
          
      - name: Download coverage badge (Shields.io)
        env:
          COVERAGE_PCT: ${{ steps.extract-coverage.outputs.percentage }}
          COVERAGE_COLOR: ${{ steps.extract-coverage.outputs.color }}
        run: |
          set -euo pipefail
          mkdir -p .github/badges
          # https://shields.io/ — static/v1 avoids path parsing issues with "66.32%".
          # Network fetch at CI time (unlike a locally rendered SVG).
          MSG=$(python3 -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['COVERAGE_PCT'] + '%', safe=''))")
          curl -fsSL "https://img.shields.io/static/v1?label=coverage&message=${MSG}&color=${COVERAGE_COLOR}" \
            -o .github/badges/coverage.svg

  # ---------------------------------------------------------------------------------------
  # Crates that had NO coverage floor anywhere until 2026-08-08.
  #
  # Coverage here is gated by name: pr.yml walks a hardcoded ALL_CRATES, the job above walks
  # CORE/CRYPTO/UTIL. 31 published crates were in none of those lists, so nothing measured
  # them and no run could go red however far their coverage fell -- a crate whose percentage
  # is never computed cannot lower one.
  #
  # This is a SEPARATE job, not more crates appended to the job above, for a concrete reason:
  # that job's per-crate step already runs ~65 minutes and its workspace pass another ~40,
  # against a 150-minute timeout. Adding ~23 crates to it would blow that budget. Sharded and
  # parallel, each shard is independent and the existing gate is untouched.
  #
  # stable only, deliberately. The job above runs a stable + pinned-nightly matrix; these
  # floors are regression backstops, and doubling 23 crates of debug tarpaulin to re-measure
  # the same lines under a second toolchain buys little for the runner time it costs.
  #
  # THRESHOLDS ARE MEASURED, NOT GUESSED, AND MEASURED *HERE*. Every number below is set ~5
  # points under what THIS job measured on 2026-08-08, and the CI figure is recorded beside it
  # so a reader can see the headroom without re-running anything. Raise them as coverage
  # improves; that is the ratchet.
  #
  # "Measured here" is load-bearing. The first version of these floors was calibrated on a
  # Windows dev box, and that turned out to describe a different build entirely:
  #   * Linux read HIGHER on 20 of 23 crates -- lib-q-rocca-s 48.32% on Windows vs 98.21% here
  #   * the DENOMINATOR differed on 17 of 23, because Linux compiles more code
  #     (lib-q-fn-dsa-kgen 2186 lines -> 3672, lib-q-rocca-s 387 -> 224)
  # Every floor still passed, which was the problem: lib-q-rocca-s sat 55 points above its
  # floor, so any regression short of catastrophic would have gone unnoticed. Retuning against
  # this job's own numbers removed ~369 points of accumulated slack across the 23.
  #
  # A local WSL run is NOT a substitute for these numbers either -- it disagreed with CI by up
  # to 44 points (lib-q-rocca-s again: 53.92% under cargo-tarpaulin 0.35.2 vs 98.21% under the
  # 0.37.0 pinned here). Retune from a CI log, not from a laptop.
  extended-coverage:
    name: Test Coverage (previously ungated crates)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Shards are balanced by measured wall clock, not by crate count.
          - shard: aead-and-primitives
            crates: "lib-q-saturnin lib-q-rocca-s lib-q-romulus lib-q-duplex-aead lib-q-tweak-aead lib-q-mac lib-q-prf"
          - shard: signatures-and-kem
            crates: "lib-q-slh-dsa lib-q-mayo lib-q-hqc lib-q-hqc-traits lib-q-random"
          - shard: zk-and-misc
            crates: "lib-q-mve lib-q-lattice-zkp lib-q-ring lib-q-ring-sig lib-q-transcript lib-q-blind-pcs lib-q-types lib-q-sca-test"
          - shard: fn-dsa-nested
            crates: "lib-q-fn-dsa-comm lib-q-fn-dsa-kgen lib-q-fn-dsa-sign lib-q-fn-dsa-vrfy"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-16
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - name: Toolchain fingerprint (cache)
        id: toolchain-fp
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(rustc -vV | sha256sum | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Shard-scoped: the shards build disjoint crate sets in parallel, and a shared key
          # would have them racing to save mutually incomplete caches under one name.
          key: ${{ runner.os }}-cargo-extcov-${{ matrix.shard }}-${{ steps.toolchain-fp.outputs.hash }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install tarpaulin
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-tarpaulin@0.37.0

      - name: Run coverage against measured floors
        shell: bash
        run: |
          set -euo pipefail
          FAILED=""
          for crate in ${{ matrix.crates }}; do
            # Measured 2026-08-08 (left of the arrow), floor (right). See docs/coverage-scope.md.
            case "$crate" in
              lib-q-saturnin)     THRESH=92 ;;  # CI 97.25%
              lib-q-transcript)   THRESH=92 ;;  # CI 97.96%
              lib-q-fn-dsa-kgen)  THRESH=87 ;;  # CI 92.65%
              lib-q-blind-pcs)    THRESH=95 ;;  # CI 100.00%
              lib-q-ring)         THRESH=83 ;;  # CI 88.87%
              lib-q-romulus)      THRESH=85 ;;  # CI 90.35%
              lib-q-slh-dsa)      THRESH=90 ;;  # CI 95.49%
              lib-q-hqc)          THRESH=85 ;;  # CI 90.91%
              # PROVISIONAL. Measured 100.00% (11/11) on Windows, not yet on CI, so this is
              # set low on purpose -- see the calibration note above: blind-pcs read 88.89%
              # (16/18) on Windows and 100% (16/16) here, i.e. even an 18-line crate moved its
              # denominator between environments. Tighten to CI-measured minus 5 after the
              # first run reports a figure.
              lib-q-hqc-traits)   THRESH=90 ;;  # Windows 100.00% (11/11); awaiting a CI figure
              lib-q-mve)          THRESH=83 ;;  # CI 88.52%
              lib-q-sca-test)     THRESH=63 ;;  # CI 68.22%
              lib-q-mayo)         THRESH=89 ;;  # CI 94.83%
              lib-q-duplex-aead)  THRESH=84 ;;  # CI 89.58%
              lib-q-fn-dsa-vrfy)  THRESH=63 ;;  # CI 68.15%
              lib-q-fn-dsa-sign)  THRESH=67 ;;  # CI 72.11%
              lib-q-lattice-zkp)  THRESH=79 ;;  # CI 84.08%
              lib-q-random)       THRESH=54 ;;  # CI 59.11%
              lib-q-ring-sig)     THRESH=85 ;;  # CI 90.18%
              # Re-measured 2026-08-09 at 97.76% (349/357) on Linux after `simd` joined the
              # crate's default features and `simd/neon.rs` was excluded on non-aarch64 hosts.
              # The COVERED line count is unchanged at 349 -- only the denominator moved (445 ->
              # 357), which is the evidence that no test was lost. Floor left at 93.
              lib-q-rocca-s)      THRESH=93 ;;  # CI 98.21%, re-measured 97.76% post-simd-default
              lib-q-prf)          THRESH=55 ;;  # CI 60.20%
              lib-q-mac)          THRESH=72 ;;  # CI 77.27%
              lib-q-tweak-aead)   THRESH=67 ;;  # CI 72.20%
              lib-q-fn-dsa-comm)  THRESH=56 ;;  # CI 61.00%
              lib-q-types)        THRESH=3  ;;  # CI 3.52%
                                                # a drop to zero, which is the regression that
                                                # matters on a crate this small.
              *)
                echo "::error::$crate has no measured floor in this job. Measure it with"
                echo "::error::scripts/run-coverage.sh and add a case, or record it in"
                echo "::error::scripts/coverage-floor-exemptions.txt. Refusing to invent one."
                exit 1
                ;;
            esac
            echo "::group::$crate (floor ${THRESH}%)"
            # Do not let the first failure hide the rest: collect and fail at the end, so one
            # run tells you every crate that regressed rather than only the alphabetically
            # unlucky one.
            if bash scripts/run-coverage.sh --crate "$crate" --threshold "$THRESH" \
                 --output-dir "coverage-$crate" --toolchain stable; then
              echo "$crate OK"
            else
              FAILED="$FAILED $crate"
            fi
            echo "::endgroup::"
          done
          if [[ -n "$FAILED" ]]; then
            echo "::error::below their coverage floor:$FAILED"
            exit 1
          fi
