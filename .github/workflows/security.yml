name: Security Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security checks daily
    - cron: '0 2 * * *'

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Core security validation - runs first
  core-security:
    name: Core Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cache-key: ${{ steps.cache-key.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      
      - name: Generate cache key
        id: cache-key
        run: echo "value=${{ github.sha }}-${{ github.run_id }}" >> $GITHUB_OUTPUT
      
      - name: Run core security validation
        uses: ./.github/actions/rust-build
        with:
          run-security-audit: "true"
          run-format-check: "false"
          run-clippy: "false"
          run-tests: "false"
          run-workspace-builds: "false"
      
      - name: Validate NIST compliance
        run: |
          echo "🔒 Running NIST compliance validation..."
          cargo run -p lib-q-utils --bin security-validator --features "std" -- validate-nist
          echo "✅ NIST compliance validation passed"

  # Cryptographic algorithm validation - parallel with core security
  crypto-validation:
    name: Cryptographic Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-07-16
        with:
          toolchain: stable
      
      - name: Run cryptographic tests
        run: |
          echo "🔐 Running cryptographic validation tests..."
          GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
          # Run constant_time tests for each package that has them. NOTE: no `--features
          # "all-algorithms"` -- lib-q-sha3/lib-q-k12 do not declare that feature (only the
          # umbrella `lib-q` crate does), so `-p lib-q-sha3 --features "all-algorithms"` was a
          # hard `error: the package 'lib-q-sha3' does not contain this feature` on every run,
          # masked by `|| echo`. See ci.yml's constant-time job, which already had the correct
          # (featureless) form.
          bash "$GUARD" -- cargo test --test constant_time -p lib-q-sha3
          bash "$GUARD" -- cargo test --test constant_time -p lib-q-k12
          echo "✅ Cryptographic tests completed successfully"
      
      # Replaces three steps named "Validate KEM algorithms", "Validate hash functions" and
      # "Validate ZKP systems". Each consisted of an echo, a comment describing a check, and
      # an echo of a check mark -- no command that could observe anything, and no way to
      # fail. All three fed this job's result into "Overall Security Status: PASSED".
      #
      # Their three claims -- only PQC KEMs, only SHA-3-family hashing, only post-quantum
      # ZKPs -- are one question at the dependency level: does any crate depend on
      # pre-quantum cryptography? That is now actually checked, against a reviewed allowlist,
      # because the blanket form of the claim is false: FIPS 205 SLH-DSA-SHA2 needs SHA-2,
      # MAYO needs AES-CTR, and NIST KAT harnesses need an AES-CTR-DRBG. The allowlist
      # records those with reasons and fails on anything new, on any entry that has gone
      # stale, and on the pairing/discrete-log stacks a ZK crate would otherwise reach for.
      - name: Validate cryptographic dependency surface
        run: |
          echo "🔑 Validating the classical-cryptography surface..."
          # Self-test first: this check replaced one that could not fail, so a clean result
          # is only worth anything if detection is re-proven on every run.
          python3 scripts/security_check_classical_crypto.py --self-test
          python3 scripts/security_check_classical_crypto.py .

      - name: Validate signature algorithms
        run: |
          echo "✍️  Validating signature algorithms..."
          # Check that only NIST PQC-process signature schemes are implemented (ML-DSA/FIPS 204
          # and SLH-DSA/FIPS 205 are standardized; FN-DSA is NIST-selected, FIPS 206 not yet
          # published)
          echo "Validating FN-DSA implementation (FIPS 206 not yet published)..."
          GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
          cd lib-q-fn-dsa
          bash "$GUARD" -- cargo test --test security_tests --features "std,rand" -- nist_compliance
          echo "✅ Signature algorithm validation completed"
      
      - name: Validate RNG systems
        run: |
          echo "🎲 Validating RNG systems..."
          GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
          # Test RNG entropy quality and security. NOTE: the first filter used to read
          # `entropy::tests::test_entropy_quality_assessment` -- that test actually lives in
          # validation.rs (`validation::tests::...`), so the old path matched nothing anywhere in
          # the crate and this step ran 0 tests while reporting success (no `|| echo` needed to
          # hide it -- a name filter matching zero tests is not a cargo error). See
          # test-rng/action.yml for the same fix and the local repro.
          cd lib-q-random
          bash "$GUARD" -- cargo test --features "std,secure,zeroize,entropy-validation" validation::tests::test_entropy_quality_assessment
          bash "$GUARD" -- cargo test --features "std,secure,zeroize,entropy-validation" validation::tests::test_entropy_validation
          echo "✅ RNG system validation completed"

  # Constant-time verification - critical for crypto
  constant-time:
    name: Constant-Time Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      
      - name: Run constant-time validation
        uses: ./.github/actions/rust-build
        with:
          run-security-audit: "false"
          run-format-check: "false"
          run-clippy: "true"
          run-tests: "false"
          run-workspace-builds: "false"
          features: "all-algorithms"
      
      - name: Run constant-time tests
        run: |
          echo "⏱️  Testing constant-time operations..."
          GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
          # Run constant_time tests for each package that has them. No `--features
          # "all-algorithms"` for lib-q-sha3/lib-q-k12 -- see the crypto-validation job above for
          # why that flag was always a hard cargo error there.
          bash "$GUARD" -- cargo test --test constant_time -p lib-q-sha3
          bash "$GUARD" -- cargo test --test constant_time -p lib-q-k12
          # The filter here was `constant_time`, which matches NONE of the 8 tests in
          # lib-q-fn-dsa/tests/security_tests.rs -- so this step ran zero tests and exited 0 for
          # as long as it has existed. The vacuous-tests guard caught it the first time it wrapped
          # this call site. Name the two timing tests explicitly (libtest accepts multiple filters);
          # they share no substring, so there is no single filter that selects both. If a
          # constant-time test is added to that file, add it here too -- the guard will fail loudly
          # if this list ever stops matching, but it cannot tell you about a test you never listed.
          bash "$GUARD" -- cargo test --test security_tests -p lib-q-fn-dsa --features "std,rand" -- test_signing_latency_smoke welch_t_detects_synthetic_shift
          bash "$GUARD" -- cargo test --features "std,secure,zeroize" --test constant_time -p lib-q-random
          echo "✅ Constant-time tests completed successfully"
      
      - name: Check for timing side-channels
        run: |
          echo "🔍 Running timing vulnerability analysis..."
          cargo run -p lib-q-utils --bin security-validator --features "std" -- validate-timing

  # Memory safety validation - parallel with constant-time
  memory-safety:
    name: Memory Safety Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      
      - name: Run memory safety validation
        uses: ./.github/actions/rust-build
        with:
          run-security-audit: "false"
          run-format-check: "false"
          run-clippy: "true"
          run-tests: "false"
          run-workspace-builds: "false"
      
      - name: Check memory safety
        run: |
          echo "🧠 Running memory safety validation..."
          cargo run -p lib-q-utils --bin security-validator --features "std" -- validate-memory

  # Dependency security audit - parallel execution
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      
      - name: Run dependency security audit
        uses: ./.github/actions/rust-build
        with:
          run-security-audit: "true"
          run-format-check: "false"
          run-clippy: "false"
          run-tests: "false"
          run-workspace-builds: "false"
      
      - name: Install cargo-outdated
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-outdated@0.19.0
      
      - name: Check for outdated dependencies
        # Informational only; the step already tolerates cargo failure, and the runner is
        # occasionally reclaimed mid-`cargo outdated` (registry traversal is slow on 280+ deps).
        continue-on-error: true
        timeout-minutes: 5
        run: |
          echo "🔍 Checking for outdated dependencies..."
          cargo outdated --root-deps-only --depth 1 || echo "⚠️  Some dependencies may be outdated"
          echo "✅ Outdated dependency check completed"
      
      # This step used to run:
      #     cargo tree --format "{p} {f}" | grep -v "crates.io" | grep -v "github.com" || true
      # `cargo tree --format "{p} {f}"` prints a package and its features and never prints a
      # source, so both filters matched 0 of 1212 lines; the output was discarded, `|| true`
      # erased the exit status, and the step echoed success regardless. Had the filters ever
      # matched, `grep -v "github.com"` would have hidden git dependencies -- the very thing
      # worth finding. Now checked properly, via cargo metadata's per-package source.
      - name: Validate dependency sources
        run: |
          echo "🔗 Validating dependency sources..."
          python3 scripts/security_check_dependency_sources.py --self-test
          python3 scripts/security_check_dependency_sources.py .

  # WASM security validation - runs after core security
  wasm-security:
    name: WASM Security Validation
    needs: core-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      
      - name: Build WASM
        uses: ./.github/actions/wasm-build
        with:
          working-directory: lib-q
          features: "wasm,all-algorithms"
          targets: "web,nodejs"
      
      - name: Validate WASM security
        run: |
          echo "🌐 Validating WASM build artifacts..."
          ls -la lib-q/pkg/ || echo "No pkg directory found"
          if [ -d "lib-q/pkg" ]; then
            echo "WASM package contents:"
            ls -la lib-q/pkg/
            echo "WASM file size:"
            ls -lh lib-q/pkg/*.wasm 2>/dev/null || echo "No .wasm files found"
            
            # Validate that WASM exports are secure
            echo "✅ WASM security validation passed"
          fi

  # Security report generation - runs after all other jobs
  security-report:
    name: Generate Security Report
    needs: [core-security, crypto-validation, constant-time, memory-safety, dependency-audit, wasm-security]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v7
      
      - name: Generate security summary
        run: |
          echo "# 🔒 Security Validation Report" > security-report.md
          echo "Generated: $(date)" >> security-report.md
          echo "" >> security-report.md
          echo "## 📊 Summary" >> security-report.md
          echo "- NIST compliance: ${{ needs.core-security.result }}" >> security-report.md
          echo "- Cryptographic validation: ${{ needs.crypto-validation.result }}" >> security-report.md
          echo "- Constant-time operations: ${{ needs.constant-time.result }}" >> security-report.md
          echo "- Memory safety: ${{ needs.memory-safety.result }}" >> security-report.md
          echo "- Dependency security: ${{ needs.dependency-audit.result }}" >> security-report.md
          echo "- WASM security: ${{ needs.wasm-security.result }}" >> security-report.md
          echo "" >> security-report.md
          
          # Determine overall security status
          if [[ "${{ needs.core-security.result }}" == "success" ]] && \
             [[ "${{ needs.crypto-validation.result }}" == "success" ]] && \
             [[ "${{ needs.constant-time.result }}" == "success" ]] && \
             [[ "${{ needs.memory-safety.result }}" == "success" ]] && \
             [[ "${{ needs.dependency-audit.result }}" == "success" ]]; then
            echo "## ✅ Overall Security Status: PASSED" >> security-report.md
            echo "All critical security validations passed successfully." >> security-report.md
          else
            echo "## ❌ Overall Security Status: FAILED" >> security-report.md
            echo "Critical security validations failed. Please review the issues above." >> security-report.md
          fi
          
          echo "" >> security-report.md
          echo "## 🔍 Details" >> security-report.md
          echo "This report covers:" >> security-report.md
          echo "- NIST post-quantum algorithm compliance" >> security-report.md
          echo "- Constant-time operation verification" >> security-report.md
          echo "- Memory safety and zeroization checks" >> security-report.md
          echo "- Dependency vulnerability scanning" >> security-report.md
          echo "- WASM build artifact validation" >> security-report.md
          echo "" >> security-report.md
          echo "## 📋 Next Steps" >> security-report.md
          if [[ "${{ needs.core-security.result }}" == "success" ]] && \
             [[ "${{ needs.crypto-validation.result }}" == "success" ]] && \
             [[ "${{ needs.constant-time.result }}" == "success" ]] && \
             [[ "${{ needs.memory-safety.result }}" == "success" ]] && \
             [[ "${{ needs.dependency-audit.result }}" == "success" ]]; then
            echo "✅ Security validation passed. Code is ready for deployment." >> security-report.md
          else
            echo "❌ Security issues detected. Please address before deployment." >> security-report.md
          fi
      
      - name: Upload security report
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: security-report.md
      
      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            try {
              const fs = require('fs');
              const report = fs.readFileSync('security-report.md', 'utf8');
              const needs = JSON.parse(process.env.NEEDS || '{}');

              const criticalJobs = [
                'core-security',
                'crypto-validation',
                'constant-time',
                'memory-safety',
                'dependency-audit'
              ];

              let securityPassed = true;
              for (const job of criticalJobs) {
                if (needs[job]?.result !== 'success') {
                  securityPassed = false;
                  break;
                }
              }
              
              let commentBody = report;
              if (securityPassed) {
                commentBody += '\n\n---\n\n✅ **Security validation passed!** This code meets all security requirements.';
              } else {
                commentBody += '\n\n---\n\n❌ **Security validation failed!** Please address security issues before merging.';
              }
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
              
              console.log('✅ Security report posted to PR successfully');
            } catch (error) {
              console.error('❌ Failed to post security report to PR:', error.message);
              console.log('📋 Security report is available as an artifact');
              // Don't fail the workflow if commenting fails
            }
