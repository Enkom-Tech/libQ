name: WASM API Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wasm-docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build wasm32 docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-08-05
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Build WASM-target docs
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: '--cfg getrandom_backend="wasm_js" -C panic=abort'
        run: |
          rustup target add wasm32-unknown-unknown
          RUSTDOCFLAGS="--cfg docsrs" cargo doc --no-deps --target wasm32-unknown-unknown --features wasm -p lib-q-core

      # Single-crate `cargo doc` does not emit doc/index.html; Pages needs one at the site root.
      - name: Add Pages landing index
        run: |
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html lang="en">' \
            '<head>' \
            '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=lib_q_core/">' \
            '<link rel="canonical" href="lib_q_core/">' \
            '<title>lib-q-core (wasm32) API docs</title>' \
            '</head>' \
            '<body>' \
            '<p><a href="lib_q_core/">lib-q-core</a> API documentation (wasm32-unknown-unknown).</p>' \
            '</body>' \
            '</html>' \
            > target/wasm32-unknown-unknown/doc/index.html

      # Pages exists only on GitHub. The forge runs this workflow too (same .github/ directory)
      # and its Pages API answers 404, which turned every forge push to main red on a step that
      # has nothing to check there. The doc build above still runs on both; publishing does not.
      - if: github.server_url == 'https://github.com'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - if: github.server_url == 'https://github.com'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: target/wasm32-unknown-unknown/doc

  deploy:
    name: Deploy docs to Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.server_url == 'https://github.com'
    permissions:
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prune old GitHub Pages deployments
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner,
              repo,
              environment: 'github-pages',
              per_page: 100,
            });
            for (const deployment of deployments) {
              await github.rest.repos.deleteDeployment({
                owner,
                repo,
                deployment_id: deployment.id,
              });
            }
            core.info(
              deployments.length === 0
                ? 'No previous github-pages deployments to prune'
                : `Pruned ${deployments.length} previous github-pages deployment(s)`,
            );

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
