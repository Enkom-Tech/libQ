name: Pull Request Validation

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Core PR validation - runs first and fastest
  core-validation:
    name: Core Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cache-key: ${{ steps.cache-key.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      
      - name: Generate cache key
        id: cache-key
        run: echo "value=${{ github.sha }}-${{ github.run_id }}" >> $GITHUB_OUTPUT
      
      - name: Core validation
        uses: ./.github/actions/rust-build
        with:
          run-security-audit: "true"
          run-format-check: "true"
          run-clippy: "true"
          run-tests: "false"
          run-workspace-builds: "false"
          features: "all-algorithms"
          package: "lib-q"
      
      # `--cfg docsrs` reproduces the docs.rs build; without it, docs.rs-only
      # breakage is invisible to CI. See the same note in ci.yml.
      - name: Check documentation
        env:
          RUSTDOCFLAGS: --cfg docsrs
        run: cargo doc --all-features --no-deps --document-private-items

      - name: Compile AVX-gated Keccak paths
        run: |
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C target-feature=+avx2" \
            cargo check --target x86_64-unknown-linux-gnu -p lib-q-keccak -p lib-q-k12 -p lib-q-hash
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C target-feature=+avx512f" \
            cargo check --target x86_64-unknown-linux-gnu -p lib-q-keccak

  # Security validation - parallel with core validation (audit already runs in core-validation)
  security-validation:
    name: Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-07-16
        with:
          toolchain: stable

      - name: Validate classical crypto compliance
        run: |
          echo "🔐 Running classical crypto validation..."
          cargo run -p lib-q-utils --bin security-validator --features "std" -- validate-classical
      
      - name: Validate SHA-3 compliance
        run: |
          echo "📊 Running SHA-3 compliance validation..."
          cargo run -p lib-q-utils --bin security-validator --features "std" -- validate-sha3

  # Test coverage analysis - runs after core validation
  # This is a focused coverage check for PRs
  # For full coverage analysis, see coverage.yml workflow
  test-coverage:
    name: Test Coverage
    needs: core-validation
    runs-on: ubuntu-latest
    # 60 min: the heaviest affected-crate case is lib-q-zkp, whose instrumented lib-tests
    # alone run ~10 min under `tarpaulin --engine llvm` (full STARK prove/verify round-trips),
    # and with doctests + the other zkp test binaries the single-crate pass lands at ~29-30 min.
    # The 45-min cap was still too tight in practice: it passed on PR #61 but timed out on
    # #62 and #63 at exactly 45:00 — a wall-clock cancel, not a test or coverage-threshold
    # failure. Runner-speed variance alone spans that margin, so the cap needs real headroom.
    # (The ~3 min tarpaulin source build is separately removed in .github/actions/rust-test.)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      
      # Determine which package to test based on PR changes
      - name: Determine affected packages
        id: affected-packages
        run: |
          # Fetch the base branch to ensure we can diff against it
          git fetch origin ${{ github.base_ref }}
          
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          
          # Define all lib-q crates
          CORE_CRATES="lib-q-core lib-q-keccak lib-q-hash lib-q-sha3 lib-q-keccak-digest lib-q-k12"
          CRYPTO_CRATES="lib-q-kem lib-q-ml-kem lib-q-ml-dsa lib-q-sig lib-q-aead lib-q-hpke lib-q-fn-dsa lib-q-cb-kem"
          UTIL_CRATES="lib-q-platform lib-q-intrinsics lib-q-utils lib-q-zkp"
          STARK_PLONKY_CRATES="lib-q-stark lib-q-stark-air lib-q-stark-challenger lib-q-stark-commit lib-q-stark-dft lib-q-stark-field lib-q-stark-field-testing lib-q-stark-fri lib-q-stark-interpolation lib-q-stark-matrix lib-q-stark-mds lib-q-stark-merkle lib-q-stark-mersenne31 lib-q-stark-monty31 lib-q-stark-rayon lib-q-stark-symmetric lib-q-stark-util lib-q-stark-shake256 lib-q-stark-shake128 lib-q-stark-sha3-256 lib-q-poseidon lib-q-plonky-multilinear-util lib-q-plonky-keccak-air lib-q-plonky-lookup lib-q-plonky-uni-stark lib-q-plonky-batch-stark lib-q-plonky"
          # Crates that had no coverage floor anywhere until 2026-08-08, now gated in
          # coverage.yml's `extended-coverage` job. Listed here too so a PR that touches one
          # measures it, instead of falling through to lib-q-core and reporting a number about
          # a crate the PR did not change.
          # Their floors are in the case statement below and MUST stay there: several measure
          # below the `*)` default of 70, so being in this list without a case entry would fail
          # every PR that touches them.
          EXTENDED_CRATES="lib-q-saturnin lib-q-rocca-s lib-q-romulus lib-q-duplex-aead lib-q-tweak-aead lib-q-mac lib-q-prf lib-q-slh-dsa lib-q-mayo lib-q-hqc lib-q-hqc-traits lib-q-random lib-q-mve lib-q-lattice-zkp lib-q-ring lib-q-ring-sig lib-q-transcript lib-q-blind-pcs lib-q-types lib-q-sca-test lib-q-fn-dsa-comm lib-q-fn-dsa-kgen lib-q-fn-dsa-sign lib-q-fn-dsa-vrfy"
          ALL_CRATES="$CORE_CRATES $CRYPTO_CRATES $UTIL_CRATES $STARK_PLONKY_CRATES $EXTENDED_CRATES"
          
          # Check which critical packages were modified
          AFFECTED=""
          for crate in $ALL_CRATES; do
            if echo "$CHANGED_FILES" | grep -q "^$crate/"; then
              AFFECTED="$crate"
              break
            fi
          done
          
          # If no specific crate was modified, check if root files were changed
          if [ -z "$AFFECTED" ]; then
            if echo "$CHANGED_FILES" | grep -q "^lib-q/\|^Cargo\.toml\|^Cargo\.lock"; then
              # Workspace root or umbrella crate changed, test the main lib-q package
              AFFECTED="lib-q"
            else
              # Default to lib-q-core if no specific package is identified
              AFFECTED="lib-q-core"
            fi
          fi
          
          echo "package=$AFFECTED" >> $GITHUB_OUTPUT
          echo "Testing package: $AFFECTED"
          # Per-crate gates (ratcheted as coverage improves; see docs/coverage-scope.md).
          case "$AFFECTED" in
            lib-q-core) echo "coverage-threshold=78" >> $GITHUB_OUTPUT ;;
            # Portable ML-DSA (AVX2 excluded from denominator): ratchet toward 70%; see docs/coverage-scope.md.
            lib-q-ml-dsa) echo "coverage-threshold=60" >> $GITHUB_OUTPUT ;;
            lib-q-keccak|lib-q-kem) echo "coverage-threshold=65" >> $GITHUB_OUTPUT ;;
            lib-q-sig) echo "coverage-threshold=66" >> $GITHUB_OUTPUT ;;
            lib-q-aead) echo "coverage-threshold=68" >> $GITHUB_OUTPUT ;;
            lib-q-hpke) echo "coverage-threshold=66" >> $GITHUB_OUTPUT ;;
            lib-q-cb-kem) echo "coverage-threshold=68" >> $GITHUB_OUTPUT ;;
            lib-q-zkp) echo "coverage-threshold=65" >> $GITHUB_OUTPUT ;;
            # Previously ungated crates. Floors are ~5 points under what CI itself measured on
            # 2026-08-08 (the CI figure is in the trailing comment), so they are regression
            # backstops rather than aspirations.
            #
            # Calibrate from a CI log, never from a laptop: the first cut of these was measured
            # on Windows and read up to 55 points low (lib-q-rocca-s 48.32% there vs 98.21% on
            # CI, with a different denominator), which left floors that passed while protecting
            # nothing. ci_guard_coverage_floors.py fails if these drift from coverage.yml.
            lib-q-transcript) echo "coverage-threshold=92" >> $GITHUB_OUTPUT ;;     # CI 97.96%
            lib-q-saturnin) echo "coverage-threshold=92" >> $GITHUB_OUTPUT ;;     # CI 97.25%
            lib-q-fn-dsa-kgen) echo "coverage-threshold=87" >> $GITHUB_OUTPUT ;;     # CI 92.65%
            lib-q-blind-pcs) echo "coverage-threshold=95" >> $GITHUB_OUTPUT ;;     # CI 100.00%
            lib-q-ring) echo "coverage-threshold=83" >> $GITHUB_OUTPUT ;;     # CI 88.87%
            lib-q-romulus) echo "coverage-threshold=85" >> $GITHUB_OUTPUT ;;     # CI 90.35%
            lib-q-slh-dsa) echo "coverage-threshold=90" >> $GITHUB_OUTPUT ;;     # CI 95.49%
            lib-q-hqc) echo "coverage-threshold=85" >> $GITHUB_OUTPUT ;;     # CI 90.91%
            # PROVISIONAL until CI measures it; see coverage.yml for the reasoning.
            lib-q-hqc-traits) echo "coverage-threshold=90" >> $GITHUB_OUTPUT ;;     # Windows 100.00%
            lib-q-mve) echo "coverage-threshold=83" >> $GITHUB_OUTPUT ;;     # CI 88.52%
            lib-q-sca-test) echo "coverage-threshold=63" >> $GITHUB_OUTPUT ;;     # CI 68.22%
            lib-q-mayo) echo "coverage-threshold=89" >> $GITHUB_OUTPUT ;;     # CI 94.83%
            lib-q-duplex-aead) echo "coverage-threshold=84" >> $GITHUB_OUTPUT ;;     # CI 89.58%
            lib-q-fn-dsa-vrfy) echo "coverage-threshold=63" >> $GITHUB_OUTPUT ;;     # CI 68.15%
            lib-q-fn-dsa-sign) echo "coverage-threshold=67" >> $GITHUB_OUTPUT ;;     # CI 72.11%
            lib-q-lattice-zkp) echo "coverage-threshold=79" >> $GITHUB_OUTPUT ;;     # CI 84.08%
            lib-q-random) echo "coverage-threshold=54" >> $GITHUB_OUTPUT ;;     # CI 59.11%
            lib-q-ring-sig) echo "coverage-threshold=85" >> $GITHUB_OUTPUT ;;     # CI 90.18%
            lib-q-rocca-s) echo "coverage-threshold=93" >> $GITHUB_OUTPUT ;;     # CI 98.21%
            lib-q-prf) echo "coverage-threshold=55" >> $GITHUB_OUTPUT ;;     # CI 60.20%
            lib-q-mac) echo "coverage-threshold=72" >> $GITHUB_OUTPUT ;;     # CI 77.27%
            lib-q-tweak-aead) echo "coverage-threshold=67" >> $GITHUB_OUTPUT ;;     # CI 72.20%
            lib-q-fn-dsa-comm) echo "coverage-threshold=56" >> $GITHUB_OUTPUT ;;     # CI 61.00%
            lib-q-types) echo "coverage-threshold=3" >> $GITHUB_OUTPUT ;;     # CI 3.52%
            *) echo "coverage-threshold=70" >> $GITHUB_OUTPUT ;;
          esac
      
      - name: Run coverage tests
        uses: ./.github/actions/rust-test
        with:
          features: ${{ steps.affected-packages.outputs.package == 'lib-q' && 'all-algorithms' || (steps.affected-packages.outputs.package == 'lib-q-kem' && 'std,alloc,ml-kem,hqc' || (steps.affected-packages.outputs.package == 'lib-q-ml-kem' && 'std,deterministic' || (steps.affected-packages.outputs.package == 'lib-q-cb-kem' && 'std,rand,getrandom,alloc,zeroize,cbkem348864' || ''))) }}
          run-coverage: "true"
          coverage-threshold: ${{ steps.affected-packages.outputs.coverage-threshold }}
          package: ${{ steps.affected-packages.outputs.package }}
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  # WASM compatibility check
  wasm-check:
    name: WASM Compatibility
    needs: core-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      
      - name: Build WASM
        uses: ./.github/actions/wasm-build
        with:
          working-directory: lib-q
          features: "wasm,all-algorithms"
          targets: "web,nodejs"

  # Documentation validation
  docs-validation:
    name: Documentation Validation
    needs: core-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-07-16
        with:
          toolchain: stable
      
      - name: Check documentation completeness
        env:
          RUSTDOCFLAGS: --cfg docsrs
        run: |
          # Check that all public APIs are documented
          cargo doc --all-features --no-deps --document-private-items
          
          # Check for missing documentation
          MISSING_DOCS=$(cargo doc --all-features --no-deps 2>&1 | grep -c "missing documentation" || true)
          if [ $MISSING_DOCS -gt 0 ]; then
            echo "⚠️  WARNING: $MISSING_DOCS items missing documentation"
          else
            echo "✅ All public APIs are documented"
          fi
      
      - name: Check README examples
        run: |
          # Verify that README examples compile
          cargo check --examples --package lib-q --features "all-algorithms"
          echo "✅ README examples compile successfully"

      - name: Build and run lib-q-examples
        run: |
          cargo build -p lib-q-examples --examples
          cargo run -p lib-q-examples --example ml_dsa_working_no_std
          echo "✅ lib-q-examples build and ML-DSA example run successfully"

  # PR summary and reporting - runs after all other jobs
  pr-summary:
    name: PR Summary
    needs: [core-validation, security-validation, test-coverage, wasm-check, docs-validation]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate PR summary
        run: |
          echo "# 🔍 Pull Request Summary" > pr-summary.md
          echo "Generated: $(date)" >> pr-summary.md
          echo "" >> pr-summary.md
          echo "## 📋 Validation Results" >> pr-summary.md
          echo "- Core Validation: ${{ needs.core-validation.result }}" >> pr-summary.md
          echo "- Security Validation: ${{ needs.security-validation.result }}" >> pr-summary.md
          echo "- Test Coverage: ${{ needs.test-coverage.result }}" >> pr-summary.md
          echo "- WASM Compatibility: ${{ needs.wasm-check.result }}" >> pr-summary.md
          echo "- Documentation: ${{ needs.docs-validation.result }}" >> pr-summary.md
          echo "" >> pr-summary.md
          
          # Determine overall status
          if [[ "${{ needs.core-validation.result }}" == "success" ]] && \
             [[ "${{ needs.security-validation.result }}" == "success" ]] && \
             [[ "${{ needs.test-coverage.result }}" == "success" ]]; then
            echo "## ✅ Overall Status: PASSED" >> pr-summary.md
          else
            echo "## ❌ Overall Status: FAILED" >> pr-summary.md
          fi
          
          echo "" >> pr-summary.md
          echo "## 🔒 Security Checklist" >> pr-summary.md
          echo "- [ ] No classical cryptographic algorithms" >> pr-summary.md
          echo "- [ ] Only SHA-3 family hash functions" >> pr-summary.md
          echo "- [ ] Constant-time operations" >> pr-summary.md
          echo "- [ ] Proper memory zeroization" >> pr-summary.md
          echo "- [ ] Input validation" >> pr-summary.md
          echo "- [ ] Error handling" >> pr-summary.md
          echo "" >> pr-summary.md
          echo "## 📝 Review Notes" >> pr-summary.md
          echo "Please review the security implications of this change carefully." >> pr-summary.md
          echo "All cryptographic changes require security team review." >> pr-summary.md
      
      - name: Upload PR summary
        uses: actions/upload-artifact@v7
        with:
          name: pr-summary
          path: pr-summary.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            try {
              const fs = require('fs');
              const summary = fs.readFileSync('pr-summary.md', 'utf8');
              const needs = JSON.parse(process.env.NEEDS || '{}');

              const criticalJobs = [
                'core-validation',
                'security-validation',
                'test-coverage'
              ];

              let shouldApprove = true;
              for (const job of criticalJobs) {
                if (needs[job]?.result !== 'success') {
                  shouldApprove = false;
                  break;
                }
              }
              
              let commentBody = summary;
              if (shouldApprove) {
                commentBody += '\n\n---\n\n✅ **Automated validation passed!** This PR is ready for review.';
              } else {
                commentBody += '\n\n---\n\n❌ **Automated validation failed!** Please address the issues above before merging.';
              }
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
              
              console.log('✅ PR summary posted successfully');
            } catch (error) {
              console.error('❌ Failed to post PR summary:', error.message);
              console.log('📋 PR summary is available as an artifact');
              // Don't fail the workflow if commenting fails
            }
