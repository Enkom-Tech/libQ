# Bounded fuzzing for lib-q-zkp (postcard STARK proof decode + small prove).
# Runs weekly and on demand; does not block PR CI.

name: ZKP fuzz (scheduled)

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: "0"

permissions:
  # Least-privilege default; jobs that need more elevate locally (e.g. coverage badge commit).
  contents: read

jobs:
  fuzz:
    name: cargo-fuzz (lib-q-zkp)
    # GitHub-only: fuzzing runs on GitHub's weekly schedule / workflow_dispatch, not the
    # shared Forgejo runner.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: nightly
          components: rust-src

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz zkp_verify_bytes
        run: |
          cd lib-q-zkp/fuzz
          cargo fuzz run zkp_verify_bytes -- -max_total_time=120 -timeout=10

      - name: Fuzz zkp_prove_arithmetic
        run: |
          cd lib-q-zkp/fuzz
          cargo fuzz run zkp_prove_arithmetic -- -max_total_time=180 -timeout=60
