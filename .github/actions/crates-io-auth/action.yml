# yaml-language-server: $schema=../../schemas/github-action.json
name: crates.io authentication
description: >-
  Short-lived crates.io token via Trusted Publishing (OIDC) using rust-lang/crates-io-auth-action.
  There is no API-token fallback. The calling job must run in the `release-publish` environment with
  `permissions: id-token: write`, and each crate needs a crates.io trusted-publisher entry for
  this repository, workflow and environment. The action revokes the token in its post step.
outputs:
  token:
    description: Token for cargo publish (valid for this job only)
    value: ${{ steps.oidc.outputs.token }}
runs:
  using: composite
  steps:
    - name: Authenticate with crates.io (Trusted Publishing)
      id: oidc
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
