# yaml-language-server: $schema=../../schemas/github-action.json
name: Test FN-DSA
description: Run FN-DSA quick smoke tests, security checks, and optional benchmarks (full keygen KAT is manual)
inputs:
  working-directory:
    description: Working directory for fn-dsa crate
    default: lib-q-fn-dsa
    required: true
  features:
    description: Features to enable for testing
    default: "std,rand"
    required: false
  rust-version:
    description: Rust toolchain version to use
    default: "stable"
    required: false
  run-benchmarks:
    description: Whether to run benchmarks
    default: "false"
    required: false
  test-algorithms:
    description: Unused (reserved for workflow matrix compatibility)
    default: ""
    required: false
  run-security-tests:
    description: Whether to run comprehensive security tests
    default: "true"
    required: false
  run-constant-time:
    description: Whether to run constant-time verification
    default: "true"
    required: false

runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-07-16
      with:
        toolchain: ${{ inputs.rust-version }}
        components: rustfmt, clippy, rust-src
        targets: thumbv7em-none-eabi

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-fn-dsa-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-fn-dsa-
    
    - name: Security audit
      shell: bash
      run: |
        echo "🔒 Running security audit for FN-DSA..."
        cargo install cargo-audit --locked
        cargo audit --deny warnings
        echo "✅ Security audit completed successfully"
    
    - name: Check formatting
      shell: bash
      run: |
        echo "📝 Checking code formatting..."
        cd ${{ inputs.working-directory }}
        cargo fmt --all -- --check
        echo "✅ Formatting check completed"
    
    - name: Clippy linting with security checks
      shell: bash
      run: |
        echo "🔍 Running Clippy linting with security checks..."
        cd ${{ inputs.working-directory }}
        # Enable additional security-related lints
        RUSTFLAGS="-D warnings" cargo clippy --all-targets --features "${{ inputs.features }}" -- \
          -D clippy::unwrap_used \
          -D clippy::expect_used \
          -D clippy::panic \
          -D clippy::unimplemented \
          -D clippy::todo \
          -D clippy::unreachable \
          -D clippy::dbg_macro \
          -D clippy::print_stdout \
          -D clippy::print_stderr
        echo "✅ Clippy linting completed"
    
    - name: Build with security-focused flags
      shell: bash
      run: |
        echo "🔨 Building with security-focused flags..."
        cd ${{ inputs.working-directory }}
        # Use security-focused build flags
        RUSTFLAGS="-C target-cpu=generic -C overflow-checks=on" \
        cargo build --features "${{ inputs.features }}" --release
        echo "✅ Build completed"
    
    - name: Verify no_std build (bare-metal thumbv7em)
      shell: bash
      env:
        # lib-q-core/lib-q-random declare a `cdylib` (for wasm-pack) that Cargo builds on every
        # target; a no_std cdylib needs std on a hosted target, so the no_std surface is checked on a
        # bare-metal target where the unsupported cdylib is dropped and only the rlib is checked.
        CARGO_TARGET_THUMBV7EM_NONE_EABI_RUSTFLAGS: '--cfg getrandom_backend="custom"'
      run: |
        echo "🔨 Checking no_std build on thumbv7em-none-eabi..."
        cd ${{ inputs.working-directory }}
        cargo check --no-default-features --features "alloc,rand" --target thumbv7em-none-eabi
        echo "✅ no_std check completed"
    
    # Per-crate feature selection. Every other feature gate in CI is workspace-wide
    # (`--all-features`), where the `lib-q-fn-dsa` facade enables `shake256x4` on `-comm` and
    # feature unification hands that same `-comm` build to every leaf — so a leaf whose own
    # `shake256x4` forwards nothing still compiles and the missing forward is invisible.
    # `-kgen`/`-sign` shipped exactly that (`shake256x4 = []`, as upstream fn-dsa 0.3.0 does):
    # the feature flipped their call sites onto `fn_dsa_comm::shake::SHAKE256x4`, which `-comm`
    # only compiles under the same feature, so `cargo check -p lib-q-fn-dsa-kgen --features
    # shake256x4` failed with E0433 for every consumer that selected the crate directly.
    # Keep one `-p` per invocation: merging them re-unifies the features and tests nothing.
    - name: Per-crate feature wiring (shake256x4)
      shell: bash
      run: |
        echo "🔗 Checking per-crate feature wiring (no cross-crate feature unification)..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd "${{ github.workspace }}"
        for p in lib-q-fn-dsa-comm lib-q-fn-dsa-kgen lib-q-fn-dsa-sign; do
          cargo check -p "$p" --features shake256x4
        done
        for p in lib-q-fn-dsa-comm lib-q-fn-dsa-kgen lib-q-fn-dsa-sign lib-q-fn-dsa-vrfy; do
          cargo check -p "$p" --all-features
        done
        # Manifest-level guard for the same invariant (fails without building the broken config).
        bash "$GUARD" -- cargo test -p lib-q-fn-dsa-kgen --test feature_forwarding
        # SHAKE256x4 must equal four 64-bit-interleaved SHAKE256 streams on BOTH dispatch
        # paths; x86_64 takes the AVX2 branch unless no_avx2 forces the portable one.
        bash "$GUARD" -- cargo test -p lib-q-fn-dsa-comm --features shake256x4 shake256x4
        bash "$GUARD" -- cargo test -p lib-q-fn-dsa-comm --features shake256x4,no_avx2 shake256x4
        # Exercises the feature through keygen/signing (gauss::sample_tv carries its own
        # shake256x4 test-vector set).
        bash "$GUARD" -- cargo test -p lib-q-fn-dsa-kgen --features shake256x4
        bash "$GUARD" -- cargo test -p lib-q-fn-dsa-sign --features shake256x4
        echo "✅ Per-crate feature wiring verified"

    - name: Run quick FN-DSA smoke tests
      shell: bash
      run: |
        echo "🧪 Running quick FN-DSA smoke tests (release)..."
        echo "Full keygen KAT + std degrees (manual / pre-release): cargo test -p lib-q-fn-dsa-kgen -- --ignored --release --test-threads=1"
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        rm -rf target/release-ci
        cd "${{ github.workspace }}"
        bash "$GUARD" -- cargo test -p lib-q-fn-dsa-alg self_test --profile release-ci -- --test-threads=1
        bash "$GUARD" -- cargo test -p lib-q-fn-dsa keypair_generation --profile release-ci --features "${{ inputs.features }}"
        bash "$GUARD" -- cargo test -p lib-q-fn-dsa test_basic_fn_dsa_functionality --profile release-ci --features "${{ inputs.features }}"
        echo "✅ Quick smoke tests completed"
    
    - name: Run security tests
      if: inputs.run-security-tests == 'true'
      shell: bash
      run: |
        echo "🛡️ Running security tests..."
        cd ${{ inputs.working-directory }}
        cargo test --test security_tests --features "${{ inputs.features }}" --verbose
        echo "✅ Security tests completed"
    
    - name: Statistical timing check (sign, Welch t)
      if: inputs.run-constant-time == 'true'
      shell: bash
      run: |
        echo "⏱️ Statistical timing check (sign, Welch t, release-ci build)..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd "${{ github.workspace }}"
        # tests/constant_time.rs's two timing tests are #[cfg_attr(debug_assertions, ignore)] --
        # without --profile release-ci both are ignored, this step reports 0 passed, and the
        # guard fails loudly rather than reporting a silent pass (t_9d1766f3 profile-drop
        # tripwire). See that file's module doc for exactly what this does and does not measure:
        # mean wall-clock timing over n=1000 samples/class on message and key axes -- not
        # cycle-accurate, single-trace, or microarchitectural evidence.
        bash "$GUARD" -- cargo test -p lib-q-fn-dsa --profile release-ci --test constant_time --features "${{ inputs.features }}" -- --nocapture
        echo "✅ Statistical timing check completed"
    
    - name: Run benchmarks
      if: inputs.run-benchmarks == 'true'
      shell: bash
      run: |
        echo "📊 Running benchmarks..."
        rm -rf target/release
        cd ${{ inputs.working-directory }}
        cargo bench --features "${{ inputs.features }}"
        echo "✅ Benchmarks completed"
    
    - name: Cross-compilation test (ARM64)
      shell: bash
      run: |
        echo "🏗️ Testing ARM64 cross-compilation..."
        cd ${{ inputs.working-directory }}
        rustup target add aarch64-unknown-linux-gnu
        cargo check --target aarch64-unknown-linux-gnu --features "${{ inputs.features }}"
        echo "✅ Cross-compilation test completed"
    
    - name: WASM compilation test
      shell: bash
      env:
        # Ensure getrandom WASM backend is properly configured with panic=abort
        CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: '--cfg getrandom_backend="wasm_js" -C panic=abort'
      run: |
        echo "🌐 Testing WASM compilation..."
        cd ${{ inputs.working-directory }}
        rustup target add wasm32-unknown-unknown
        cargo check --target wasm32-unknown-unknown --features "${{ inputs.features }}" --lib
        echo "✅ WASM compilation test completed"
    
    - name: Memory safety validation
      shell: bash
      run: |
        echo "🧠 Running memory safety validation..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}
        # Test for memory leaks and unsafe operations. The filter is "memory", not
        # "memory_safety" -- no test in security_tests.rs is named memory_safety*, so that
        # filter matched 0 of 7 tests (silently, `|| echo` was hiding it) while "memory"
        # matches test_memory_optimization_security + test_memory_zeroization.
        bash "$GUARD" -- cargo test --features "${{ inputs.features }}" --test security_tests -- memory
        echo "✅ Memory safety validation completed"

    - name: NIST compliance verification
      shell: bash
      run: |
        echo "📋 Verifying NIST compliance..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}
        # Verify that only NIST PQC-process algorithms are implemented (FN-DSA is NIST-selected
        # for future FIPS 206; FIPS 206 has not been published, so there is no standard to be
        # "approved" against yet)
        bash "$GUARD" -- cargo test --features "${{ inputs.features }}" --test security_tests -- nist_compliance
        echo "✅ NIST compliance verification completed"
