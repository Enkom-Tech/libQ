# yaml-language-server: $schema=../../schemas/github-action.json
name: Test K12
description: Run K12 (KangarooTwelve) tests with security validation and comprehensive feature testing
inputs:
  working-directory:
    description: Working directory for K12 testing
    default: lib-q-hash
    required: true
  features:
    description: Features to enable for testing
    default: "alloc,oid"
    required: false
  rust-version:
    description: Rust toolchain version to use
    default: "stable"
    required: false
  run-benchmarks:
    description: Whether to run benchmarks
    default: "false"
    required: false
  test-algorithms:
    description: Specific algorithms to test
    default: "kangarootwelve"
    required: false

runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-07-16
      with:
        toolchain: ${{ inputs.rust-version }}
        components: rustfmt, clippy
        targets: thumbv7em-none-eabi

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-k12-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-k12-
    
    - name: Security audit
      shell: bash
      run: |
        echo "Running security audit for K12..."
        cargo install cargo-audit --locked
        cargo audit --deny warnings
        echo "Security audit completed successfully"
    
    - name: Check formatting
      shell: bash
      run: |
        echo "Checking code formatting..."
        cd ${{ inputs.working-directory }}
        cargo fmt --all -- --check
        echo "Formatting check completed"
    
    - name: Clippy linting
      shell: bash
      run: |
        echo "Running Clippy linting..."
        cd ${{ inputs.working-directory }}
        cargo clippy --all-targets --all-features -- -D warnings
        echo "Clippy linting completed"
    
    - name: Build with default features
      shell: bash
      run: |
        echo "Building with default features..."
        cd ${{ inputs.working-directory }}
        cargo build --features "${{ inputs.features }}"
        echo "Build completed"
    
    - name: Build with all features
      shell: bash
      run: |
        echo "Building with all features..."
        cd ${{ inputs.working-directory }}
        cargo build --all-features
        echo "Build with all features completed"
    
    - name: Run all tests
      shell: bash
      run: |
        echo "Running all tests..."
        cd ${{ inputs.working-directory }}
        cargo test --features "${{ inputs.features }}"
        echo "All tests completed"
    
    # OBSERVED 2026-08: `test_k12_implementations` and `test_create_hash_by_name` do not exist
    # anywhere in this repo (`grep -rln` over every tracked .rs file: no hits). Both filters
    # matched 0 of 64 tests in lib-q-hash and reported green regardless -- one of the two was
    # additionally piped into `grep ... || true`, which also would have hidden a real cargo
    # failure. Replaced with the crate's real, unfiltered suite (verified 64 passed) run under
    # the runtime vacuity guard, and the "with customization" duplicate step (which ran the same
    # dead filter a second time) is dropped rather than repurposed onto an unverified filter.
    - name: Test K12 implementations (lib-q-hash suite, incl. KT128/KT256 registration)
      shell: bash
      run: |
        echo "Testing K12 implementations..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}
        bash "$GUARD" -- cargo test --features "${{ inputs.features }}"
        echo "K12 implementation tests completed"

    - name: Test K12 length encoding
      shell: bash
      run: |
        echo "Testing K12 length encoding..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        # `test_length_encode` exists in lib-q-k12/src/block_api.rs, not in this step's
        # `working-directory` (default lib-q-hash) -- the filter matched 0 of 64 tests here.
        # Run it where the test actually lives (verified: 1 passed).
        cd "${{ github.workspace }}"
        bash "$GUARD" -- cargo test -p lib-q-k12 length_encode
        echo "K12 length encoding tests completed"
    
    - name: Cross-compilation test (ARM64)
      shell: bash
      run: |
        echo "Testing ARM64 cross-compilation..."
        cd ${{ inputs.working-directory }}
        rustup target add aarch64-unknown-linux-gnu
        cargo check --target aarch64-unknown-linux-gnu --features "${{ inputs.features }}"
        echo "Cross-compilation test completed"
    
    - name: WASM compilation test
      shell: bash
      env:
        # Ensure getrandom WASM backend is properly configured with panic=abort
        CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: '--cfg getrandom_backend="wasm_js" -C panic=abort'
      run: |
        echo "Testing WASM compilation..."
        cd ${{ inputs.working-directory }}
        rustup target add wasm32-unknown-unknown
        cargo check --target wasm32-unknown-unknown --features "${{ inputs.features }},wasm_js" --lib
        echo "WASM compilation test completed"
    
    - name: Feature combination tests (no_std bare-metal + host run)
      shell: bash
      env:
        # lib-q-core declares a `cdylib` (for wasm-pack) that Cargo builds on every target; a no_std
        # cdylib needs std on a hosted target. So the no_std-portable surface is compile-verified on a
        # bare-metal target (where the unsupported cdylib is dropped), and std feature combinations are
        # RUN on the host. (A blanket `cargo hack --feature-powerset` enumerated non-compiling combos:
        # lib-q-hash requires `alloc`, and `std` pulls std-only deps such as once_cell.)
        CARGO_TARGET_THUMBV7EM_NONE_EABI_RUSTFLAGS: '--cfg getrandom_backend="custom"'
      run: |
        echo "Checking no_std-portable feature combinations on thumbv7em-none-eabi..."
        cd ${{ inputs.working-directory }}
        for feats in "alloc" "alloc,oid" "alloc,zeroize" "alloc,oid,zeroize"; do
          echo "  no_std check: $feats"
          cargo check --no-default-features --features "$feats" --target thumbv7em-none-eabi
        done
        echo "Running std feature combinations on the host..."
        for feats in "std" "std,oid" "std,zeroize" "std,oid,zeroize"; do
          echo "  host test: $feats"
          cargo test --no-default-features --features "$feats"
        done
        echo "Feature combination tests completed"
    
    - name: Run benchmarks
      if: inputs.run-benchmarks == 'true' && inputs.rust-version == 'nightly'
      shell: bash
      run: |
        echo "Running K12 benchmarks..."
        rm -rf target/release
        cd ${{ inputs.working-directory }}
        # OBSERVED 2026-08-03: no crate named the working-directory input's crate (default
        # lib-q-hash) has ever had a `[[bench]] name = "k12"` target -- `grep -n '\[\[bench\]\]'
        # lib-q-hash/Cargo.toml` matches nothing and there is no `lib-q-hash/benches/` directory.
        # `cargo bench --features "nightly" --bench k12` therefore always failed with "no bench
        # target named `k12`"; the old `|| echo "No K12 benchmarks found"` made that permanent
        # breakage indistinguishable from "nothing to benchmark yet" and there is also no
        # `nightly` feature on lib-q-hash (`cargo bench --features nightly` errors with "does not
        # contain this feature" independent of the target name).
        #
        # The real K12 benchmark lives in the sibling crate `lib-q-k12` as
        # `[[bench]] name = "k12_benchmarks"` (criterion, harness = false -- runs on stable, no
        # nightly feature needed at all). `-p lib-q-k12` resolves it from cargo's workspace graph
        # regardless of this step's cwd. Verified locally: `cargo bench -p lib-q-k12 --bench
        # k12_benchmarks -- --test` exits 0 and reports "Success" for every benchmark group.
        # This step is currently unreachable anyway -- every caller of this action in ci.yml sets
        # run-benchmarks:"false" and/or rust-version:"stable" -- so fixing the invocation carries
        # no risk to the current green build; it only fixes what would happen the day someone
        # enables this row.
        cargo bench -p lib-q-k12 --bench k12_benchmarks
        echo "K12 benchmarks completed"
    
    - name: Test K12 integration
      shell: bash
      run: |
        echo "Testing K12 integration..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}
        # Test that K12 is properly integrated with the main hash system. Previously piped into
        # `grep -i "kangaroo|k12" || true`: the pipe hid the `test result:` summary line from any
        # guard, and `|| true` after a pipefail pipeline would have masked a real cargo failure.
        bash "$GUARD" -- cargo test --features "${{ inputs.features }}" -- --nocapture
        echo "K12 integration tests completed"
