# yaml-language-server: $schema=../../schemas/github-action.json
name: Test HPKE
description: Run HPKE tests with security validation and algorithm testing
inputs:
  working-directory:
    description: Working directory for HPKE crate
    default: lib-q-hpke
    required: true
  features:
    description: Features to enable for testing
    default: "std,ml-kem,saturnin,shake256,hash,secure-rng"
    required: false
  rust-version:
    description: Rust toolchain version to use
    default: "stable"
    required: false
  run-benchmarks:
    description: Whether to run benchmarks
    default: "false"
    required: false
  run-security-tests:
    description: Whether to run security validation tests
    default: "true"
    required: false
  run-constant-time:
    description: Whether to run constant-time validation
    default: "true"
    required: false
  test-algorithms:
    description: Specific HPKE algorithms to test
    default: "ml-kem512,saturnin256,shake256"
    required: false

runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-16
      with:
        toolchain: ${{ inputs.rust-version }}
        components: rustfmt, clippy, rust-src
    
    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-hpke-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-hpke-
    
    - name: Security audit
      shell: bash
      run: |
        echo "Running security audit for HPKE..."
        cargo install cargo-audit --locked
        cargo audit --deny warnings
        echo "Security audit completed successfully"
    
    - name: Check formatting
      shell: bash
      run: |
        echo "Checking code formatting..."
        cd ${{ inputs.working-directory }}
        cargo fmt --all -- --check
        echo "Formatting check completed"
    
    - name: Clippy linting
      shell: bash
      run: |
        echo "Running Clippy linting..."
        cd ${{ inputs.working-directory }}
        cargo clippy --all-targets --all-features -- -D warnings
        echo "Clippy linting completed"
    
    # HPKE requires alloc (and hash/KEM/AEAD features for a buildable library). Bare
    # --no-default-features disables alloc and fails compile_error! in lib.rs.
    - name: Build with no default features
      shell: bash
      run: |
        echo "Building with no default features (explicit minimal features)..."
        cd ${{ inputs.working-directory }}
        cargo build --no-default-features --features "alloc,hash,ml-kem,saturnin,shake256,secure-rng"
        echo "Build completed"
    
    - name: Build with all features
      shell: bash
      run: |
        echo "Building with features: ${{ inputs.features }}"
        cd ${{ inputs.working-directory }}
        cargo build --features "${{ inputs.features }}"
        echo "Build with features completed"
    
    - name: Run tests with no default features
      shell: bash
      run: |
        echo "Running tests with no default features (explicit minimal features)..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}
        bash "$GUARD" -- cargo test --no-default-features --features "alloc,hash,ml-kem,saturnin,shake256,secure-rng"
        echo "Tests completed"

    - name: Run tests with all features
      shell: bash
      run: |
        echo "Running tests with features: ${{ inputs.features }}"
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}
        bash "$GUARD" -- cargo test --features "${{ inputs.features }}"
        echo "Tests with features completed"
    
    - name: Run documentation tests
      shell: bash
      run: |
        echo "Running documentation tests..."
        cd ${{ inputs.working-directory }}
        cargo test --features "${{ inputs.features }}" --doc
        echo "Documentation tests completed"
    
    - name: Run unit tests
      shell: bash
      run: |
        echo "Running unit tests..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}
        bash "$GUARD" -- cargo test --features "${{ inputs.features }}" --test unit
        echo "Unit tests completed"

    - name: Run integration tests
      shell: bash
      run: |
        echo "Running integration tests..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}
        bash "$GUARD" -- cargo test --features "${{ inputs.features }}" --test integration
        echo "Integration tests completed"

    - name: Run RFC 9180 compliance tests
      shell: bash
      run: |
        echo "Running RFC 9180 compliance tests..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}
        # `rfc9180_compliance_tests.rs` is `#![cfg(feature = "std")]`-gated; without `std` in the
        # matrix features this step compiled to an empty binary and reported "0 passed" / exit 0
        # while its own name claimed RFC 9180 compliance was verified (t_9f13e8e5).
        bash "$GUARD" -- cargo test --features "${{ inputs.features }}" --test rfc9180_compliance_tests
        echo "RFC 9180 compliance tests completed"

    - name: Run security validation tests
      shell: bash
      run: |
        echo "Running security validation tests..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}
        bash "$GUARD" -- cargo test --features "${{ inputs.features }}" --test security_validation_comprehensive_tests
        echo "Security validation tests completed"
    
    - name: Test WASM compatibility
      shell: bash
      run: |
        echo "Testing WASM compatibility..."
        cd ${{ inputs.working-directory }}
        rustup target add wasm32-unknown-unknown
        cargo check --target wasm32-unknown-unknown --features "${{ inputs.features }},wasm" --lib
        echo "WASM compatibility test completed"
    
    - name: Run benchmarks
      if: inputs.run-benchmarks == 'true'
      shell: bash
      run: |
        echo "Running benchmarks..."
        rm -rf target/release
        cd ${{ inputs.working-directory }}
        cargo bench --features "${{ inputs.features }}"
        echo "Benchmarks completed"
    
    - name: Run security validation tests (lib-Q integration)
      if: inputs.run-security-tests == 'true'
      shell: bash
      run: |
        echo "Running security validation tests (lib-Q integration)..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}
        # Test libQ integration
        cd ..
        bash "$GUARD" -- cargo test --features "hpke" --package lib-q
        echo "Security validation tests (lib-Q integration) completed"

    - name: Run constant-time validation
      if: inputs.run-constant-time == 'true'
      shell: bash
      run: |
        # This checks ct-eq correctness and memory-access-pattern invariants only. The 5 real
        # statistical timing tests in side_channel_analysis_tests.rs are #[ignore]d as
        # environment-specific (see the file for the Welch-t-style approach used elsewhere in
        # this repo, e.g. lib-q-hqc/tests/reed_solomon_constant_time.rs) -- this step does NOT
        # perform statistical timing validation. See t_9f13e8e5.
        echo "Running constant-time correctness checks (ct-eq + memory-access patterns; statistical timing tests are #[ignore]d as environment-specific)..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}
        # HPKE operations should be constant-time
        bash "$GUARD" -- cargo test --features "${{ inputs.features }}" --test side_channel
        echo "Constant-time correctness checks completed"
    
    - name: Cross-compilation test (ARM64)
      shell: bash
      run: |
        echo "Testing ARM64 cross-compilation..."
        cd ${{ inputs.working-directory }}
        rustup target add aarch64-unknown-linux-gnu
        cargo check --target aarch64-unknown-linux-gnu --features "${{ inputs.features }}"
        echo "Cross-compilation test completed"
    
    - name: Test HPKE modes
      shell: bash
      run: |
        echo "Testing HPKE modes..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}

        # Test different HPKE modes. psk_mode_tests / auth_mode_tests /
        # authpsk_mode_comprehensive_tests are all `#![cfg(feature = "std")]`-gated -- see
        # t_9f13e8e5.
        bash "$GUARD" -- cargo test --features "${{ inputs.features }}" --test psk_mode_tests
        bash "$GUARD" -- cargo test --features "${{ inputs.features }}" --test auth_mode_tests
        bash "$GUARD" -- cargo test --features "${{ inputs.features }}" --test authpsk_mode_comprehensive_tests
        echo "HPKE modes tested successfully"

    - name: Test algorithm agnostic functionality
      shell: bash
      run: |
        echo "Testing algorithm agnostic functionality..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}
        bash "$GUARD" -- cargo test --features "${{ inputs.features }}" --test algorithm_agnostic_tests
        bash "$GUARD" -- cargo test --features "${{ inputs.features }}" --test comprehensive_algorithm_agnostic_tests
        echo "Algorithm agnostic tests completed"

    - name: Test thread safety
      shell: bash
      run: |
        echo "Testing thread safety..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}
        bash "$GUARD" -- cargo test --features "${{ inputs.features }}" --test thread_safety_tests
        echo "Thread safety tests completed"
