# yaml-language-server: $schema=../../schemas/github-action.json
name: Run benchmark shard
description: Run Criterion benchmarks for one workspace package (one CI matrix shard)
inputs:
  package:
    description: Cargo package name (-p)
    required: true
  features:
    description: Optional --features value
    default: ""
    required: false
  bench:
    description: Optional single --bench target name
    default: ""
    required: false
  working-directory:
    description: Directory to run cargo bench from (repo root by default)
    default: "."
    required: false
  rust-version:
    description: Rust toolchain version
    default: "stable"
    required: false

runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
      with:
        toolchain: ${{ inputs.rust-version }}
        components: rust-src

    - name: Cargo.lock fingerprint (SHA3-256)
      id: lockfp2
      shell: bash
      # SHA3-256 instead of hashFiles(), which is SHA-256: lib-Q uses no SHA-2.
      run: echo "hash=$({ git ls-files -z -- '*Cargo.lock' | sort -z | xargs -0 cat; cat /dev/null; } | { if command -v python3 >/dev/null 2>&1; then python3 -c 'import hashlib,sys; print(hashlib.sha3_256(sys.stdin.buffer.read()).hexdigest())'; else openssl dgst -sha3-256 -r | cut -d' ' -f1; fi; })" >> "$GITHUB_OUTPUT"
    - name: Restore cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-bench-${{ steps.lockfp2.outputs.hash }}
        restore-keys: |
          ${{ runner.os }}-bench-

    - name: Run benchmark shard
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        ARGS=(-p "${{ inputs.package }}")
        if [[ -n "${{ inputs.features }}" ]]; then
          ARGS+=(-f "${{ inputs.features }}")
        fi
        if [[ -n "${{ inputs.bench }}" ]]; then
          ARGS+=(-b "${{ inputs.bench }}")
        fi
        echo "Package: ${{ inputs.package }}"
        bash ./scripts/run-criterion-benches.sh "${ARGS[@]}"
