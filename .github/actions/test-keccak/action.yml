# yaml-language-server: $schema=../../schemas/github-action.json
name: Test Keccak
description: Run Keccak tests with security validation and benchmarking
inputs:
  working-directory:
    description: Working directory for keccak crate
    default: lib-q-keccak
    required: true
  features:
    description: Features to enable for testing
    default: "asm"
    required: false
  rust-version:
    description: Rust toolchain version to use
    default: "1.99.1"
    required: false
  run-benchmarks:
    description: Whether to run benchmarks (uses the dated nightly in nightly-version)
    default: "false"
    required: false
  run-simd:
    description: Whether to run portable-SIMD tests (uses the dated nightly in nightly-version)
    default: "false"
    required: false
  nightly-version:
    description: Explicit dated nightly used ONLY for the portable_simd tests and benches (never floating)
    default: "nightly-2026-11-01"
    required: false
  test-algorithms:
    description: Specific algorithms to test
    default: ""
    required: false

runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
      with:
        toolchain: ${{ inputs.rust-version }}
        components: rustfmt, clippy, rust-src
    
    - name: Cargo.lock fingerprint (SHA3-256)
      id: lockfp10
      shell: bash
      # SHA3-256 instead of hashFiles(), which is SHA-256: lib-Q uses no SHA-2.
      run: echo "hash=$({ git ls-files -z -- '*Cargo.lock' | sort -z | xargs -0 cat; cat /dev/null; } | { if command -v python3 >/dev/null 2>&1; then python3 -c 'import hashlib,sys; print(hashlib.sha3_256(sys.stdin.buffer.read()).hexdigest())'; else openssl dgst -sha3-256 -r | cut -d' ' -f1; fi; })" >> "$GITHUB_OUTPUT"
    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-keccak-${{ steps.lockfp10.outputs.hash }}
        restore-keys: |
          ${{ runner.os }}-keccak-
    
    - name: Security audit
      shell: bash
      run: |
        echo "Running security audit for Keccak..."
        cargo install cargo-audit --locked
        cargo audit --deny warnings
        echo "Security audit completed successfully"
    
    - name: Check formatting
      shell: bash
      run: |
        echo "Checking code formatting..."
        cd ${{ inputs.working-directory }}
        cargo fmt --all -- --check
        echo "Formatting check completed"
    
    - name: Clippy linting
      shell: bash
      run: |
        echo "Running Clippy linting..."
        cd ${{ inputs.working-directory }}
        cargo clippy --all-targets --all-features -- -D warnings
        echo "Clippy linting completed"
    
    - name: Build with no default features
      shell: bash
      run: |
        echo "Building with no default features..."
        cd ${{ inputs.working-directory }}
        WORKING_DIR="${{ inputs.working-directory }}"
        if [[ "$WORKING_DIR" == "lib-q-keccak" ]]; then
          echo "Building lib-q-keccak with explicit no_std panic handler for CI compatibility"
          # Use explicit panic handler feature for proper no_std builds
          # This provides the required panic handler while avoiding test conflicts
          rm -rf target/dev-no-std
          cargo build --profile dev-no-std --no-default-features --features "alloc"
        else
          cargo build --no-default-features
        fi
        echo "Build completed"
    
    - name: Build with all features
      shell: bash
      run: |
        echo "Building with features: ${{ inputs.features }}"
        cd ${{ inputs.working-directory }}
        cargo build --features "${{ inputs.features }}"
        echo "Build with features completed"
    
    - name: Run tests with no default features
      shell: bash
      run: |
        echo "Running tests with no default features..."
        cd ${{ inputs.working-directory }}
        WORKING_DIR="${{ inputs.working-directory }}"
        if [[ "$WORKING_DIR" == "lib-q-keccak" ]]; then
          echo "Running tests for lib-q-keccak - using std for test harness compatibility"
          # For no_std crates, we run tests with std enabled because the test harness requires std
          # The no_std compatibility is verified by the build step above
          cargo test --features "alloc,std"
        else
          cargo test --no-default-features
        fi
        echo "Tests completed"
    
    - name: Run tests with all features
      shell: bash
      run: |
        echo "Running tests with features: ${{ inputs.features }}"
        cd ${{ inputs.working-directory }}
        cargo test --features "${{ inputs.features }}"
        echo "Tests with features completed"
    
    - name: Install dated nightly (SIMD tests and benches only)
      if: inputs.run-simd == 'true' || inputs.run-benchmarks == 'true'
      shell: bash
      run: rustup toolchain install "${{ inputs.nightly-version }}" --profile minimal -c rust-src
    - name: Run portable-SIMD tests (dated nightly)
      if: inputs.run-simd == 'true'
      shell: bash
      run: |
        echo "Running SIMD tests..."
        cd ${{ inputs.working-directory }}
        cargo +${{ inputs.nightly-version }} test --features "simd"
        echo "SIMD tests completed"
    
    - name: Run benchmarks (dated nightly)
      if: inputs.run-benchmarks == 'true'
      shell: bash
      run: |
        echo "Running benchmarks..."
        rm -rf target/release
        cd ${{ inputs.working-directory }}
        cargo +${{ inputs.nightly-version }} bench --features "nightly"
        echo "Benchmarks completed"
    
    - name: Cross-compilation test (ARM64)
      shell: bash
      run: |
        echo "Testing ARM64 cross-compilation..."
        cd ${{ inputs.working-directory }}
        rustup target add aarch64-unknown-linux-gnu
        cargo check --target aarch64-unknown-linux-gnu --features "${{ inputs.features }}"
        echo "Cross-compilation test completed"
    
    - name: WASM compilation test
      shell: bash
      env:
        # Ensure getrandom WASM backend is properly configured with panic=abort
        CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: '--cfg getrandom_backend="wasm_js" -C panic=abort'
      run: |
        echo "Testing WASM compilation..."
        cd ${{ inputs.working-directory }}
        rustup target add wasm32-unknown-unknown
        cargo check --target wasm32-unknown-unknown --features "${{ inputs.features }}" --lib
        echo "WASM compilation test completed"
