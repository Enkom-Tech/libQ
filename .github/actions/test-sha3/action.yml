# yaml-language-server: $schema=../../schemas/github-action.json
name: Test SHA3
description: Run SHA3 tests with security validation and comprehensive feature testing
inputs:
  working-directory:
    description: Working directory for SHA3 testing
    default: lib-q-hash
    required: true
  features:
    description: Features to enable for testing
    default: "alloc,oid"
    required: false
  rust-version:
    description: Rust toolchain version to use
    default: "stable"
    required: false
  test-algorithms:
    description: >-
      Unused (reserved for workflow matrix compatibility). Used to drive a per-algorithm
      `cargo test --test "*$alg*"` loop; deleted because `--test` does not support globs, so that
      loop failed with "no test target matches pattern" for every algorithm on every call,
      silently, behind `|| true`. Every listed variant is covered directly by
      cshake.rs/turboshake.rs/basic_functionality.rs/security.rs below.
    default: "sha3-224,sha3-256,sha3-384,sha3-512,keccak224,keccak256,keccak384,keccak512,turboshake128,turboshake256"
    required: false
  run-benchmarks:
    description: Whether to run benchmarks
    default: "false"
    required: false

runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-16
      with:
        toolchain: ${{ inputs.rust-version }}
        components: rustfmt, clippy
    
    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-sha3-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-sha3-
    
    - name: Security audit
      shell: bash
      run: |
        echo "Running security audit for SHA3..."
        cargo install cargo-audit --locked
        cargo audit --deny warnings
        echo "Security audit completed successfully"
    
    - name: Check formatting
      shell: bash
      run: |
        echo "Checking code formatting..."
        cd ${{ inputs.working-directory }}
        cargo fmt --all -- --check
        echo "Formatting check completed"
    
    - name: Clippy linting
      shell: bash
      run: |
        echo "Running Clippy linting..."
        cd ${{ inputs.working-directory }}
        cargo clippy --all-targets --all-features -- -D warnings
        echo "Clippy linting completed"
    
    - name: Build with default features
      shell: bash
      run: |
        echo "Building with default features..."
        cd ${{ inputs.working-directory }}
        cargo build --features "${{ inputs.features }}"
        echo "Build completed"
    
    - name: Build with all features
      shell: bash
      run: |
        echo "Building with all features..."
        cd ${{ inputs.working-directory }}
        cargo build --all-features
        echo "Build with all features completed"
    
    - name: Run all tests
      shell: bash
      run: |
        echo "Running all tests..."
        cd ${{ inputs.working-directory }}
        cargo test --features "${{ inputs.features }}"
        echo "All tests completed"
    
    # DELETED "Run algorithm-specific tests": it looped `cargo test --features ... --test
    # "*$alg*" || true` over every algorithm name. `cargo test --test` takes an exact target
    # name, not a glob -- confirmed locally that this fails with "no test target matches
    # pattern `*$alg*`" (exit 101) for every single algorithm, unconditionally, and always did.
    # `|| true` swallowed that for all 10 algorithms on every run, so the step always reported
    # success while testing nothing it claimed to. Every algorithm it named is covered by the
    # real per-file tests below (cshake.rs, cshake_blobby_kats.rs, turboshake.rs,
    # basic_functionality.rs, security.rs) -- a deleted honest step, not a lost one.

    - name: Test SHA3 crate (FIPS-202 + SP-800-185; Keccak *types* are in lib-q-keccak-digest)
      shell: bash
      run: |
        echo "Testing lib-q-sha3 (SHA-3 / SHAKE / cSHAKE / TurboSHAKE)..."
        cd ${{ inputs.working-directory }}
        cargo test -p lib-q-sha3 --features "${{ inputs.features }}"
        echo "lib-q-sha3 tests completed"
    
    - name: Constant-time operation verification
      shell: bash
      run: |
        echo "Verifying constant-time operations..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}
        # Run specific tests that verify constant-time behavior
        bash "$GUARD" -- cargo test --test constant_time --features "${{ inputs.features }}" -p lib-q-sha3
        echo "Constant-time verification completed"
    
    - name: Test Keccak digests (lib-q-keccak-digest)
      shell: bash
      run: |
        echo "Testing pre-FIPS Keccak digests (moved from lib-q-sha3)..."
        cd ${{ inputs.working-directory }}
        # KATs and integration tests for Keccak224–512 / Keccak256Full live in this crate
        cargo test -p lib-q-keccak-digest
        echo "lib-q-keccak-digest tests completed"
    
    - name: Test lib-q-hash (create_hash for SHA-3, Keccak, and other algorithms)
      shell: bash
      run: |
        echo "Testing lib-q-hash (provider + create_hash smoke)..."
        GUARD="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}/scripts/ci-guard-no-vacuous-tests.sh"
        cd ${{ inputs.working-directory }}
        # OBSERVED 2026-08: `create_hash_smoke_all_variants` lives in lib-q-hash/src/lib.rs, not
        # in this step's `working-directory` (lib-q-sha3) -- the bare filter (no `-p`) matched 0
        # of every test binary here and reported green regardless (same wrong-crate class as the
        # test-k12 `test_length_encode` finding). `-p lib-q-hash` resolves it from the workspace
        # graph regardless of cwd (verified: 1 passed).
        bash "$GUARD" -- cargo test -p lib-q-hash --features "${{ inputs.features }}" create_hash_smoke_all_variants
        echo "lib-q-hash create_hash tests completed"
    
    - name: Cross-compilation test (ARM64)
      shell: bash
      run: |
        echo "Testing ARM64 cross-compilation..."
        cd ${{ inputs.working-directory }}
        rustup target add aarch64-unknown-linux-gnu
        cargo check --target aarch64-unknown-linux-gnu --features "${{ inputs.features }}"
        echo "Cross-compilation test completed"
    
    - name: WASM compilation test
      shell: bash
      env:
        # Ensure getrandom WASM backend is properly configured with panic=abort
        CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: '--cfg getrandom_backend="wasm_js" -C panic=abort'
      run: |
        echo "Testing WASM compilation..."
        cd ${{ inputs.working-directory }}
        rustup target add wasm32-unknown-unknown
        cargo check --target wasm32-unknown-unknown --features "${{ inputs.features }}" --lib
        echo "WASM compilation test completed"
    
    - name: Feature powerset test
      shell: bash
      run: |
        echo "Testing feature combinations..."
        cd ${{ inputs.working-directory }}
        cargo install cargo-hack
        # Limit feature combinations to prevent timeouts
        # Note: --feature-powerset and --each-feature cannot be used together
        cargo hack test --feature-powerset --exclude-features default --skip asm
        echo "Feature powerset test completed"
        
    - name: Run benchmarks
      if: inputs.run-benchmarks == 'true' && inputs.rust-version == 'nightly'
      shell: bash
      run: |
        echo "Running SHA3 benchmarks..."
        rm -rf target/release
        cd ${{ inputs.working-directory }}
        # OBSERVED 2026-08-03: `[[bench]]` in lib-q-sha3/Cargo.toml is `name = "sha3_benchmarks"`,
        # not "sha3" -- `cargo bench --bench sha3` always failed with "no bench target named
        # `sha3`". lib-q-sha3 also has no `nightly` feature at all (`cargo bench -p lib-q-sha3
        # --features nightly` errors with "the package 'lib-q-sha3' does not contain this
        # feature"), and doesn't need one: the bench is criterion-based (`harness = false`), which
        # runs on stable. The old `|| echo "No SHA3 benchmarks found"` made that permanent
        # double-breakage indistinguishable from "benchmarks happen not to exist yet". Verified
        # locally: `cargo bench --bench sha3_benchmarks -- --test` (no `--features` flag) exits 0
        # and reports "Success" for every benchmark group. This step is currently unreachable
        # anyway -- every caller of this action in ci.yml sets rust-version:"stable" -- so fixing
        # the invocation carries no risk to the current green build; it only fixes what would
        # happen the day someone enables this row.
        cargo bench --bench sha3_benchmarks
        echo "SHA3 benchmarks completed"
