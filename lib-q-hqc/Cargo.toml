[package]
name = "lib-q-hqc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Post-Quantum HQC (Hamming Quasi-Cyclic) KEM for lib-Q"
keywords = ["cryptography", "post-quantum", "hqc", "kem", "nist"]
categories = ["cryptography", "wasm"]
autobenches = false
# KAT `.rsp` trees under `kats/` exceed crates.io's 10 MiB upload limit; keep for CI, not the registry tarball.
exclude = ["/kats", "/tests", "/benches", "/scripts"]


[package.metadata.cargo-machete]
ignored = [
    "criterion",
    "heapless",
    "hybrid-array",
    "js-sys",
    "rand",
    "serde",
    "serde-big-array",
]
[dependencies]
# Core libQ dependencies
lib-q-core = { path = "../lib-q-core", version = "0.0.10", default-features = false }
lib-q-types = { path = "../lib-q-types", version = "0.0.10", default-features = false }
lib-q-sha3 = { path = "../lib-q-sha3", version = "0.0.10" }
lib-q-keccak = { path = "../lib-q-keccak", version = "0.0.10", default-features = false }
lib-q-random = { path = "../lib-q-random", version = "0.0.10", optional = true, default-features = false }

# Core cryptographic primitives
hybrid-array = { workspace = true }
rand_core = { workspace = true } # RNG traits
hex = { version = "0.4.3", default-features = false, features = ["alloc"] } # Hex (direct dep so default-features can be disabled for no_std)

# Platform-specific dependencies
heapless = { version = "0.9.3", optional = true }              # no_std collections
wasm-bindgen = { workspace = true, optional = true }           # WASM bindings
js-sys = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
defmt = { version = "1.1.0", optional = true }                 # no_std logging

# Optional features
serde = { workspace = true, features = ["derive"], optional = true }
serde-big-array = { version = "0.5.1", optional = true }       # Large array serialization
zeroize = { workspace = true, optional = true, default-features = false, features = ["alloc"] } # Secure memory clearing
# Unconditional, not optional: HqcKemSecretKey and HqcKemSharedSecret compare in
# constant time in EVERY build, not only under `hardened`. A shared secret is precisely what an
# attacker wants to confirm by guessing, so a short-circuiting `==` there is a timing oracle in
# the default configuration -- which is the configuration users get.
subtle = { workspace = true, default-features = false }
aes = { workspace = true, default-features = false, optional = true } # AES for DRBG

[dev-dependencies]
# Test dependencies
lib-q-random = { path = "../lib-q-random", version = "0.0.10", features = ["std"] }
rand = { workspace = true }
wasm-bindgen-test = { workspace = true }

# Benchmarking dependencies (host targets only)
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
lib-q-sca-test = { path = "../lib-q-sca-test", version = "0.0.10", default-features = false }

[[test]]
name = "compliance"
path = "tests/compliance/main.rs"
required-features = ["alloc", "hqc", "random"]

[[test]]
name = "nist_kem_kat"
path = "tests/nist_kem_kat.rs"
required-features = ["alloc", "hqc", "random"]

# The crate's only EXTERNAL conformance check: byte-exact against the HQC designers' own v5.0.0
# intermediate-value dumps, vendored under `kats/upstream-reference/`. Everything else under
# `kats/` is a self-generated regression pin and cannot detect a misreading of the spec.
# `required-features` is load-bearing, not boilerplate: the file is
# `#![cfg(all(feature = "alloc", feature = "hqc"))]` and `hqc` is NOT a default feature, so
# without this entry the file compiles to zero tests and reports "test result: ok" while checking
# nothing. That is precisely how three sampler bugs (t_62273504) survived every other KAT here.
[[test]]
name = "upstream_reference_conformance"
path = "tests/upstream_reference_conformance.rs"
required-features = ["alloc", "hqc"]

# Byte-exact conformance against the upstream pqc-hqc.org reference implementation.
# The `required-features` line is load-bearing, not boilerplate: the test file is
# `#![cfg(all(feature = "alloc", feature = "hqc", feature = "random"))]` and `hqc` is NOT a
# default feature, so without this entry cargo auto-discovers the file, compiles it under
# default features, and the whole suite evaluates to nothing -- `cargo test -p lib-q-hqc`
# then prints "running 0 tests ... test result: ok", which reads as a pass. That is exactly
# the unfailable-check failure mode this card exists to remove, so do not drop it.
[[test]]
name = "reference_intermediates_kat"
path = "tests/reference_intermediates_kat.rs"
required-features = ["alloc", "hqc", "random"]

[[test]]
name = "hardened_dudect_smoke"
path = "tests/hardened_dudect_smoke.rs"
required-features = ["hardened"]

[[test]]
name = "official_specification_verification_test"
path = "tests/official_specification_verification_test.rs"
required-features = ["alloc", "nist-drbg"]

[[test]]
name = "comprehensive_failure_analysis_test"
path = "tests/comprehensive_failure_analysis_test.rs"
required-features = ["alloc", "nist-drbg"]

[[example]]
name = "hqc_example"
path = "examples/hqc_example.rs"
required-features = ["hqc128", "hqc192", "hqc256"]

[[bench]]
name = "performance_benchmarks"
harness = false

[[bench]]
name = "simd_benchmarks"
harness = false

[[test]]
name = "wasm_smoke"
path = "tests/wasm_smoke.rs"
required-features = ["wasm", "hqc", "random", "serialization"]

[features]
# std-by-default; bare-metal/no_std consumers build with `--no-default-features --features no_std`.
default = ["std", "alloc", "random"]

# Core features
std = ["lib-q-core/std", "lib-q-random?/std"] # Standard library support (also std-shapes the optional RNG dep)
alloc = ["lib-q-core/alloc"]        # Heap allocation support (required for std builds)
heapless = ["dep:heapless"]         # Named feature for optional dep (workspace `cargo metadata --features heapless`).
# Embedded/no_std: heapless collections + alloc (HQC's PKE/contexts use `alloc` and `lib_q_core::KemContext`,
# which is alloc-gated). A bare-metal final artifact additionally needs an integrator getrandom custom backend.
# On its own this enables zero algorithms (an empty build); combine with an algorithm feature,
# e.g. `--no-default-features --features no_std,hqc128`, verified to build clean on a real
# no_std target (thumbv7em-none-eabi) now that `hqc128`/`hqc192`/`hqc256`/`random` no longer
# hard-force `lib-q-core/std` / `lib-q-random/std`.
no_std = ["heapless", "alloc"]

# HQC algorithm variants (NIST security levels)
hqc128 = ["alloc", "random", "zeroize", "lib-q-core/alloc"]  # 128-bit security (Level 1)
hqc192 = ["alloc", "random", "zeroize", "lib-q-core/alloc"]  # 192-bit security (Level 3)
hqc256 = ["alloc", "random", "zeroize", "lib-q-core/alloc"]  # 256-bit security (Level 5)
hqc = ["hqc128", "hqc192", "hqc256"]                                # All HQC variants

# Random number generation
random = ["dep:lib-q-random", "lib-q-random/alloc", "zeroize"]      # RNG + secure stack buffers in provider decapsulation
nist-drbg = ["dep:lib-q-random", "lib-q-random/nist-drbg"]         # NIST SP 800-90A DRBG

# Platform support
wasm = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:serde-wasm-bindgen",
    "dep:serde_json",
    "hqc",
    "lib-q-core/wasm",
    "serialization",
    "zeroize",
]
serialization = ["serde", "serde-big-array"]                        # Serde serialization

# Security hardening
zeroize = ["dep:zeroize"]                                           # Automatic memory zeroization
subtle = []  # retained as a no-op for compatibility; subtle is now an unconditional dependency
# Atomic side-channel hardening gate (decapsulation CT compare/select). Do not split.
hardened = ["random", "zeroize", "subtle"]
security-hardened = ["zeroize", "hqc", "hardened"]                  # Full security hardening

# DRBG implementations (KAT / reference compatibility only — not used in production RNG paths)
kat-drbg = ["bearssl-aes"]                                          # Opt-in KAT-compatible DRBG (BearSSL-style)
aes-drbg = ["aes", "alloc"]                                         # Standard AES-256-CTR-DRBG
bearssl-aes = ["aes", "alloc"]                                      # BearSSL AES for exact KAT match

# Debug and diagnostics features (development only)
debug-drbg-interop = ["aes-drbg", "bearssl-aes"]                   # Compare DRBG implementations
debug-drbg-state = []                                               # Log DRBG state transitions
debug-drbg-state-defmt = ["debug-drbg-state", "defmt"]             # DRBG state logging with defmt

# Performance optimizations
simd-avx2 = []                                                      # AVX2 SIMD with runtime detection

[lib]
bench = false
name = "lib_q_hqc"
path = "src/lib.rs"
# wasm-pack requires `cdylib` for wasm32; `rlib` remains for Rust consumers. Native no_std CI enables `no_std_panic_handler` where applicable.
crate-type = ["cdylib", "rlib"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(eurydice)',
    'cfg(doc_cfg)',
    'cfg(kani)',
    'cfg(feature, values("lib-q-random"))',
    'cfg(feature, values("hardened", "subtle"))',
] }

[package.metadata.wasm-pack.profile.release]
# `-Oz` reduces size; see docs/wasm-security-model.md for WASM timing caveats vs native builds.
wasm-opt = ["-Oz", "--enable-bulk-memory"]
