[package]
name = "lib-q-stark-field-testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Testing utilities for finite field arithmetic and field-based operations in lib-Q STARK implementation."
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
lib-q-stark-dft = { path = "../lib-q-stark-dft", version = "0.0.11" }
lib-q-stark-field = { path = "../lib-q-stark-field", version = "0.0.11" }
lib-q-stark-matrix = { path = "../lib-q-stark-matrix", version = "0.0.11" }
lib-q-stark-util = { path = "../lib-q-stark-util", version = "0.0.11" }

criterion = { workspace = true, optional = true }
num-bigint = { workspace = true }
rand = { workspace = true, default-features = false, features = ["std"] }
serde = { workspace = true, default-features = false, features = ["alloc"] }
serde_json = { workspace = true, features = ["alloc"] }

[features]
default = []
criterion = ["dep:criterion"]
criterion-bench = ["criterion"]

[package.metadata.docs.rs]
features = ["criterion-bench"]
# Every other published crate in this workspace sets `--cfg docsrs` here; this one was
# missing it, so a future `cfg_attr(docsrs, ...)` added to this crate would silently never
# see docsrs cfg on the real docs.rs build (the same class of gap that let four other
# crates ship broken docs.rs builds undetected). Keep in sync with the workspace default.
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(eurydice)',
    'cfg(doc_cfg)',
] }

